# Локальный стек платформы: раздельные логи по сервису (TUI).
# Источник команд — scripts/run.py (один сервис = uv run python scripts/run.py <name>).
# Запуск: make app   |   mprocs   |   Zed task «app: mprocs»
#
# В TUI: j/k — выбрать процесс, Ctrl-a — фокус список/терминал, r — restart, x — stop, q — выход.

procs:
  ui_watch:
    shell: "uv run python scripts/run.py ui_watch"
  flows:
    shell: "uv run python scripts/run.py flows"
  frontend:
