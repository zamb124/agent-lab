# Локальный стек платформы: раздельные логи по сервису (TUI).
# Источник команд — scripts/dev/run.py (один сервис = .venv/bin/python -m scripts.dev.run <name>).
# exec + execvpe в dev.run: дочерний процесс mprocs — это сам сервис, без слоёв sh/uv.
# Иначе stop/restart в mprocs убивает обёртку, а granian/taskiq сиротеют.
# Запуск: make app   |   mprocs   |   Zed task «app: mprocs»
#
# В TUI: j/k — выбрать процесс, Ctrl-a — фокус список/терминал, r — restart, x — stop, q — выход.

procs:
  ui_watch:
    shell: "exec .venv/bin/python -m scripts.dev.run ui_watch"
  flows:
    shell: "exec .venv/bin/python -m scripts.dev.run flows"
