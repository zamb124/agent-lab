[project]
name = "platform-sdk"
version = "0.1.0"
description = "CLI платформы: bundle агента, запуск, evaluation, RAG, документы и поиск"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
platform = "platform_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_sdk"]
