<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <script>
        (function () {
            var stored = localStorage.getItem('platform_theme');
            var mode = stored === 'light' || stored === 'dark' ? stored : 'dark';
            document.documentElement.setAttribute('data-theme', mode);
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="/static/core/assets/js/platform-brand-sync-bootstrap.js"></script>
    <script>
        (function () {
            try {
                var brand = window.__PLATFORM_BRAND__;
                if (!brand) {
                    return;
                }
                var origin = String(brand.apexOrigin || '').replace(/\/$/, '');
                var platformName = String(brand.platformName || 'Platform');
                var title = platformName + ' — платформа автоматизации бизнеса';
                document.title = title;
                var setMeta = function (selector, attr, value) {
                    var node = document.querySelector(selector);
                    if (node) {
                        node.setAttribute(attr, value);
                    }
                };
                setMeta('meta[name="description"]', 'content', platformName + ' — пять продуктов в одном контуре: AI Studio, Knowledge Base, NetWorkle, Sync и Документы.');
                setMeta('link[rel="canonical"]', 'href', origin + '/');
                setMeta('meta[property="og:site_name"]', 'content', platformName);
                setMeta('meta[property="og:title"]', 'content', title);
                setMeta('meta[property="og:url"]', 'content', origin + '/');
                setMeta('meta[property="og:image"]', 'content', origin + '/static/frontend/assets/images/main_img.png');
                setMeta('meta[name="twitter:title"]', 'content', title);
                setMeta('meta[name="twitter:image"]', 'content', origin + '/static/frontend/assets/images/main_img.png');
                setMeta('meta[name="apple-mobile-web-app-title"]', 'content', platformName);
                var ldNode = document.getElementById('platform-ld-json');
                if (ldNode) {
                    ldNode.textContent = JSON.stringify({
                        '@context': 'https://schema.org',
                        '@graph': [
                            {
                                '@type': 'WebSite',
                                name: platformName,
                                url: origin + '/',
                                inLanguage: 'ru',
                                description: platformName + ' — пять продуктов в одном контуре: AI Studio, Knowledge Base, NetWorkle, Sync и Документы.',
                            },
                            {
                                '@type': 'Organization',
                                name: platformName,
                                url: origin + '/',
                                logo: origin + '/static/core/assets/service_logos/frontend_logo.svg',
                            },
                            {
                                '@type': 'SoftwareApplication',
                                name: platformName,
                                applicationCategory: 'BusinessApplication',
                                operatingSystem: 'Web',
                                url: origin + '/',
                                description: platformName + ' — пять продуктов в одном контуре для автоматизации бизнеса.',
                            },
                        ],
                    });
                }
            } catch (e) {
                return;
            }
        })();
    </script>
    <title>Platform — business automation</title>
    <meta name="description" content="Five products in one platform: AI Studio, Knowledge Base, NetWorkle, Sync and Documents.">
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
    <link rel="canonical" href="/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="Platform">
    <meta property="og:title" content="Platform — business automation">
    <meta property="og:description" content="Five products in one platform: AI Studio, Knowledge Base, NetWorkle, Sync and Documents.">
    <meta property="og:url" content="/">
    <meta property="og:image" content="/static/frontend/assets/images/main_img.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Platform — business automation">
    <meta name="twitter:description" content="Five products in one platform: AI Studio, Knowledge Base, NetWorkle, Sync and Documents.">
    <meta name="twitter:image" content="/static/frontend/assets/images/main_img.png">
    <link rel="icon" type="image/svg+xml" href="/static/core/assets/service_logos/frontend_logo.svg">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Цвет темы -->
    <meta name="theme-color" content="#16213e">
    <meta name="theme-color" content="#16213e" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: light)">
    
    <!-- Поддержка iOS PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Platform">
    <link rel="apple-touch-icon" href="/static/core/pwa/icons/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/core/pwa/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/core/pwa/icons/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/static/core/pwa/icons/icon-192x192.png">
    
    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#1a1a2e">
    <meta name="msapplication-TileImage" content="/static/core/pwa/icons/icon-144x144.png">
    <script type="application/ld+json" id="platform-ld-json">

      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Platform",

        }

    }
    </script>

            "lit/directives/guard.js": "/static/core/assets/js/lit/directives/guard.min.js",
            "@platform/lib/": "/static/core/lib/",
            "@capacitor/app": "/static/core/assets/js/vendor/@capacitor/app/index.js",
            "@capacitor/core": "/static/core/assets/js/vendor/@capacitor/core/index.js",
            "@capacitor/splash-screen": "/static/core/assets/js/vendor/@capacitor/splash-screen/index.js",
            "@capacitor/push-notifications": "/static/core/assets/js/vendor/@capacitor/push-notifications/index.js"
        }

    <!-- Стили -->

<style>
        body {
            margin: 0;
            padding: 0;
            background: var(--landing-bg, var(--bg-gradient, linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #1a1a2e 75%, #16213e 100%)));
            min-height: 100vh;
        }
        
        platform-app,
        frontend-app {
            display: block;
            width: 100%;
            min-height: 100vh;
        }
        
        platform-app:not(:defined),
        frontend-app:not(:defined) {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient, linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #1a1a2e 75%, #16213e 100%));
            z-index: 9999;
            color: var(--text-secondary, rgba(255, 255, 255, 0.5));
            font-family: var(--font-sans);
        }

        frontend-app:not(:defined)::after {
            content: 'AI Studio';
        }
</style>
</head>
<body>
    <frontend-app></frontend-app>
    
    <script src="/static/core/assets/js/marked.min.js"></script>

</html>
