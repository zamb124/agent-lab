<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Platform Models</title>
    <link rel="icon" type="image/svg+xml" href="/static/core/assets/service_logos/frontend_logo.svg">
    <script>
        (function () {
            try {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/frontend/api/platform/brand', false);
                xhr.setRequestHeader('Accept', 'application/json');
                xhr.send(null);
                if (xhr.status !== 200) {
                    return;
                }
                var brand = JSON.parse(xhr.responseText);
                var modelsName = String(brand.models_product_name || 'Platform Models');
                document.title = modelsName;
                window.__PLATFORM_BRAND__ = {
                    platformName: String(brand.platform_name || 'Platform'),
                    agentProductName: String(brand.agent_product_name || 'Platform Agent'),
                    modelsProductName: modelsName,
                    voiceProductName: String(brand.voice_product_name || 'Platform Voice'),
                    llmsDisplayLabel: String(brand.llms_display_label || 'Platform LLMs'),
                    flowsProductLabel: String(brand.flows_product_label || 'Platform Flows'),
                    supportEmail: String(brand.support_email || ''),
                    logoPath: String(brand.logo_path || ''),
                    apexOrigin: String(brand.apex_origin || ''),
                    supportedDomains: Array.isArray(brand.supported_domains) ? brand.supported_domains : [],
                    baseDomain: String(brand.base_domain || ''),
                    isProduction: window.location.protocol === 'https:',
                    portSuffix: window.location.port ? (':' + window.location.port) : '',
                    protocol: window.location.protocol.replace(':', ''),
                };
                var style = document.createElement('style');
                style.textContent = 'litserve-app:not(:defined)::after { content: ' + JSON.stringify(modelsName) + '; }';
                document.head.appendChild(style);
            } catch (_err) {
                /* brand bootstrap optional before module load */
            }
        })();
    </script>

    <script type="importmap">
    {
        "imports": {
            "lit": "/static/core/assets/js/lit/lit.min.js",
            "lit/decorators.js": "/static/core/assets/js/lit/decorators.min.js",
            "lit/directives/class-map.js": "/static/core/assets/js/lit/directives/class-map.min.js",
            "lit/directives/repeat.js": "/static/core/assets/js/lit/directives/repeat.min.js",
            "lit/directives/unsafe-html.js": "/static/core/assets/js/lit/directives/unsafe-html.min.js",
            "lit/directives/when.js": "/static/core/assets/js/lit/directives/when.min.js",
            "lit/directives/guard.js": "/static/core/assets/js/lit/directives/guard.min.js",
            "@platform/lib/": "/static/core/lib/"
        }
    }
    </script>

    <link rel="stylesheet" href="/static/core/assets/css/tokens.css">
    <link rel="stylesheet" href="/static/core/assets/css/reset.css">
<style>
litserve-app:not(:defined) {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-gradient);
            z-index: 9999;
            color: rgba(255, 255, 255, 0.5);
            font-family: var(--font-sans);
        }

        litserve-app:not(:defined)::after {
            content: 'Platform Models';
        }
</style>
</head>
<body class="platform-shell">
    <litserve-app></litserve-app>
    <script type="module" src="/litserve/ui/static/index.js"></script>
</body>
</html>
