# Единый реестр навигации UI-инструкций (docs/scenarios).
# tag в @pytest.mark.scenario должен быть зарегистрирован здесь.

service_order:
  - platform
  - sync
  - flows
  - worktracker
  - crm
  - rag
  - frontend
  - office
  - wiki
  - shop
  - stock
  - geo

learning_paths:
  - id: new-user
    label_ru: Новый пользователь
    label_en: New user
    intro_ru: >-
      Если вы впервые на Платформе — пройдите эти шаги по порядку: войти на сайт,
      открыть Dashboard и разобраться с меню аккаунта.
    intro_en: >-
      First time on the Platform? Follow these steps in order: sign in, open the Dashboard,
      and learn the account menu.
    steps:
      - label_ru: Основные инструкции — вход, Dashboard и меню
        label_en: Platform basics — sign-in, Dashboard, and user menu
        href: scenarios/platform/main-dashboard-user-menu/
      - label_ru: Sync — полная инструкция по чату
        label_en: Sync — complete chat guide
        href: scenarios/sync/sync-complete-guide/

  - id: developer
    label_ru: Разработчик
    label_en: Developer
    intro_ru: >-
      Минимальный путь для интеграции: быстрый старт с A2A, затем справочник API
      и инструкция по API Console в Flows.
    intro_en: >-
      Minimum integration path: A2A quickstart, API reference, and the Flows API Console guide.
    steps:
      - label_ru: Быстрый старт — первый запрос к агенту
        label_en: Quickstart — first agent request
        href: quickstart/
      - label_ru: Flows — знакомство и первый агент
        label_en: Flows — home tour and first agent
        href: scenarios/flows/flows-home-tour/
      - label_ru: Flows — первый запрос через API Console
        label_en: Flows — first request via API Console
        href: scenarios/flows/api-first-request/
      - label_ru: Flows — встраивание агента на сайт
        label_en: Flows — embed the agent on a site
        href: scenarios/flows/embed-agent-on-site/
      - label_ru: UI Kit — каталог core-компонентов
        label_en: UI Kit — core component catalog
        href: scenarios/platform/ui-kit/
      - label_ru: Справочник API
        label_en: API reference
        href: api/

  - id: sync-team
    label_ru: Команда в Sync
    label_en: Team in Sync
    intro_ru: >-
      Для команд, которые работают в чате: сначала длинная инструкция по сервису,
      затем короткие маршруты по каналам, сообщениям и звонкам.
    intro_en: >-
      For teams using chat: start with the full service guide, then short routes
      for channels, messages, and calls.
    steps:
      - label_ru: Sync — полная инструкция
        label_en: Sync — complete guide
        href: scenarios/sync/sync-complete-guide/
      - label_ru: Создание канала
        label_en: Create a channel
        href: scenarios/sync/create-topic-channel/
      - label_ru: Отправка сообщения
        label_en: Send a message
        href: scenarios/sync/send-message-in-channel/
      - label_ru: Звонок из канала
        label_en: Start a channel call
        href: scenarios/sync/channel-call-overlay/

  - id: flows
    label_ru: Flows — агенты и графы
    label_en: Flows — agents and graphs
    intro_ru: >-
      Путь от знакомства с главной Flows до опубликованного агента: каталог, создание,
      студия и канва, настройка ответов, Skills, тест в чате, инструменты и публикация.
    intro_en: >-
      From the Flows home tour to a published agent: catalog, creation, Studio vs canvas,
      answer setup, Skills, chat testing, tools, and publishing.
    steps:
      - label_ru: Знакомство с главной и каталогом
        label_en: Home tour and agent catalog
        href: scenarios/flows/flows-home-tour/
      - label_ru: Создание первого агента
        label_en: Create your first agent
        href: scenarios/flows/create-first-agent/
      - label_ru: Студия и схема редактора
        label_en: Studio and canvas editor modes
        href: scenarios/flows/agent-focus-vs-canvas/
      - label_ru: Настройка ответов агента
        label_en: Shape agent answers
        href: scenarios/flows/configure-agent-answers/
      - label_ru: Подключение Skills к агенту
        label_en: Attach Skills to the agent
        href: scenarios/flows/attach-skills-to-agent/
      - label_ru: Тест агента в чате
        label_en: Test the agent in chat
        href: scenarios/flows/test-agent-in-chat/
      - label_ru: Как настроить проверку качества и увидеть вердикт в чате
        label_en: Configure quality review and see the verdict in chat
        href: scenarios/flows/reflection-result-in-chat/
      - label_ru: Активация Skill в чате
        label_en: Skill unlocks in chat
        href: scenarios/flows/skills-unlock-in-chat/
      - label_ru: Инструменты агента
        label_en: Agent tools
        href: scenarios/flows/add-agent-tools/
      - label_ru: План агента через Skill
        label_en: Agent plan via Skill
        href: scenarios/flows/agent-plan-via-skill/
      - label_ru: План агента через инструменты
        label_en: Agent plan via tools
        href: scenarios/flows/agent-plan-via-tools/
      - label_ru: Публикация и управление
        label_en: Publish and operate
        href: scenarios/flows/publish-and-operate/

  - id: flows-skills
    label_ru: Flows — Skills
    label_en: Flows — Skills
    intro_ru: >-
      Короткий путь по процедурам агента: библиотека Skills, подключение к ноде,
      активация в чате и копия Skill.
    intro_en: >-
      A short path through agent procedures: Skills library, node attach, chat unlock,
      and Skill duplication.
    steps:
      - label_ru: Создаём Skill в библиотеке
        label_en: Create a Skill in the library
        href: scenarios/flows/manage-agent-skills/
      - label_ru: Подключаем Skill к агенту
        label_en: Attach a Skill to the agent
        href: scenarios/flows/attach-skills-to-agent/
      - label_ru: Skill активируется в чате
        label_en: Skill unlocks in chat
        href: scenarios/flows/skills-unlock-in-chat/
      - label_ru: Дублируем и правим Skill
        label_en: Duplicate and edit a Skill
        href: scenarios/flows/duplicate-and-edit-skill/
      - label_ru: План агента через Skill
        label_en: Agent plan via Skill
        href: scenarios/flows/agent-plan-via-skill/
      - label_ru: План агента через инструменты
        label_en: Agent plan via tools
        href: scenarios/flows/agent-plan-via-tools/

  - id: worktracker-operators
    label_ru: Операторы и HITL
    label_en: Operators and HITL
    intro_ru: >-
      Полный маршрут передачи диалога человеку: настройка очереди, входящие оператора,
      ожидание покупателя, перехват диалога, маршрутизация задач и наблюдение в истории.
    intro_en: >-
      Full operator handoff path: queue setup, operator inbox, customer waiting,
      dialog takeover, task routing, and tracing in run history.
    steps:
      - label_ru: Передача сложного случая оператору
        label_en: Escalate a hard case to an operator
        href: scenarios/flows/escalate-to-operator/
      - label_ru: Настройка очереди операторов
        label_en: Set up an operator queue
        href: scenarios/worktracker/setup-operator-queue/
      - label_ru: Входящие и ответ клиенту
        label_en: Operator inbox and customer reply
        href: scenarios/worktracker/operator-inbox-single-reply/
      - label_ru: Что видит покупатель при ожидании
        label_en: What the customer sees while waiting
        href: scenarios/flows/customer-waits-for-operator/
      - label_ru: Перехват диалога оператором
        label_en: Operator dialog takeover
        href: scenarios/worktracker/operator-takeover-dialog/
      - label_ru: Встроенный чат в задаче HITL
        label_en: Embedded chat in an HITL task
        href: scenarios/worktracker/hitl-embedded-operator-chat/
      - label_ru: Один ответ оператора и завершение
        label_en: Single operator reply and complete
        href: scenarios/worktracker/hitl-single-reply-complete/
      - label_ru: Маршрутизация и переназначение
        label_en: Route and reassign tasks
        href: scenarios/worktracker/route-and-reassign-tasks/
      - label_ru: Фоновая задача от агента
        label_en: Agent background task
        href: scenarios/flows/agent-logs-background-task/
      - label_ru: Передача в истории выполнения
        label_en: Operator handoff in run history
        href: scenarios/flows/trace-operator-handoff/

  - id: office-documents
    label_ru: Документы Office
    label_en: Office documents
    intro_ru: >-
      Работа с документами на /documents: от первого пространства и каталога
      до редактирования в OnlyOffice и публикации ссылки.
    intro_en: >-
      Working with documents at /documents: from the first workspace and catalog
      to OnlyOffice editing and sharing a public link.
    steps:
      - label_ru: Office — полная инструкция
        label_en: Office — complete guide
        href: scenarios/office/documents-complete-guide/
      - label_ru: Каталоги и пространство
        label_en: Workspaces and catalogs
        href: scenarios/office/workspace-and-catalogs/
      - label_ru: Создание и загрузка документов
        label_en: Create and upload documents
        href: scenarios/office/create-and-upload-documents/
      - label_ru: Редактирование в OnlyOffice
        label_en: Edit in OnlyOffice
        href: scenarios/office/edit-in-onlyoffice/
      - label_ru: Каталоги и пространство
        label_en: Workspaces and catalogs
        href: scenarios/office/workspace-and-catalogs/

