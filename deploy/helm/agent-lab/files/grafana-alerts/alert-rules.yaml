- orgId: 1
  name: platform_infra_alerts
  folder: Platform
  interval: 60s
  rules:
  - uid: scrape-target-down
    title: Scrape Target Down
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: up{job=~"platform-granian|kubelet.*|node-exporter|kube-state-metrics"} == 0
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: 'Scrape target down: {{ $labels.job }}/{{ $labels.service }}{{ $labels.pod }}{{ $labels.node }}'
      description: Prometheus cannot scrape {{ $labels.job }} target {{ $labels.instance }}
    labels:
      severity: critical
  - uid: pod-crashloop
    title: Pod Crashloop
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        expr: increase(kube_pod_container_status_restarts_total{namespace="platform"}[15m]) > 3
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 0m
    annotations:
      summary: 'Crashlooping: {{ $labels.pod }}/{{ $labels.container }}'
      description: '{{ printf "%.1f" $values.B.Value }} restarts in 15m'
    labels:
      severity: critical
  - uid: pod-phase-failed
    title: Pod Failed/Unknown
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        expr: kube_pod_status_phase{namespace="platform", phase=~"Failed|Unknown"} == 1
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: Pod {{ $labels.pod }} in phase {{ $labels.phase }}
      description: Platform pod stuck in {{ $labels.phase }} phase
    labels:
      severity: warning
  - uid: node-disk-low
    title: Node Disk Low
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: 100 * node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay"}
          < 10
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: Root filesystem almost full on {{ $labels.node }}
      description: Only {{ printf "%.1f" $values.B.Value }}% free on /
    labels:
      severity: critical
  - uid: pvc-almost-full
    title: PVC Almost Full
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: 100 * kubelet_volume_stats_used_bytes{namespace="platform"} / kubelet_volume_stats_capacity_bytes{namespace="platform"} > 85
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: PVC {{ $labels.persistentvolumeclaim }} >85% used
      description: Volume is {{ printf "%.1f" $values.B.Value }}% full
    labels:
      severity: warning
  - uid: node-mem-pressure
    title: Node Memory Pressure
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 92
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: Node memory >92% used
      description: Memory usage is {{ printf "%.1f" $values.B.Value }}%
    labels:
      severity: warning

deleteRules:
  - orgId: 1
    uid: service-down
