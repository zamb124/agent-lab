apiVersion: 1

# Алерты платформы поверх Loki и Prometheus.
#
# Селекторы всегда включают namespace="platform" — не сканируем чужие
# namespace и не ловим сторонние сервисы. service-лейбл в Loki —
# kubernetes.io/service-name/имя Deployment'а (дефисы, не snake_case).
#
# Две группы Loki: быстрые ratio/count раз в 120s и дорогие
# квантильные unwrap раз в 300s — иначе весь набор за минуту кладёт
# Loki в DeadlineExceeded. Инфра-группа на Prometheus раз в 60s.
#
# Пороги — math-выражения $B <op> N после reduce(last, A): threshold-
# условие не умеет multi-frame и падает с "frame cannot uniquely be
# identified"; math сохраняет labels для per-service инстансов.

groups:
- orgId: 1
  name: platform_alerts
  folder: Platform
  interval: 120s
  rules:
  - uid: high-error-rate
    title: High Error Rate
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (service) (rate({namespace="platform"} | json | level="ERROR" [5m])) / sum by (service) (rate({namespace="platform"} [5m]))
          * 100
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (service) (rate({namespace="platform"} [5m]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        # floor на объём логов: у воркера с 5 строк/5м один ERROR даёт 20%.
        # 0.2 строк/с = 60 строк/5м → для 5% нужно >=3 ошибок, не одна.
        expression: $B > 5 && $E > 0.2
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    keepFiringFor: 10m
    annotations:
      summary: High error rate on {{ $labels.service }}
      description: Error rate is {{ printf "%.2f" $values.B.Value }}% for service {{ $labels.service }} at {{ printf "%.3f" $values.E.Value }} lines/s
    labels:
      severity: critical
  - uid: log-ingest-stalled
    title: Log Ingest Stalled
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum(count_over_time({namespace="platform"} [5m]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B < 50
        refId: C
        type: math
    noDataState: Alerting
    execErrState: Error
    for: 2m
    annotations:
      summary: Log pipeline stalled or cluster down
      description: Only {{ printf "%.0f" $values.B.Value }} log lines across all platform services in 5m
    labels:
      severity: critical
  - uid: high-5xx-rate
    title: High 5xx Rate
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (service) (rate({namespace="platform"} | json | message="http_request" | http_status_code >= 500 [5m])) / sum by (service)
          (rate({namespace="platform"} | json | message="http_request" [5m])) * 100
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (service) (rate({namespace="platform"} | json | message="http_request" [5m]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        # >1% ловил каждый роллаут (termination-окно traefik/pod) — шум
        # на штатном событии. >5% за 5m — уже сломанный сервис.
        # floor на RPS: у тихого сервиса один 500 даёт 100%.
        expression: $B > 5 && $E > 0.1
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    keepFiringFor: 10m
    annotations:
      summary: High 5xx rate on {{ $labels.service }}
      description: 5xx rate is {{ printf "%.2f" $values.B.Value }}% for service {{ $labels.service }} at {{ printf "%.2f" $values.E.Value }} req/s
    labels:
      severity: warning
  - uid: taskiq-failures
    title: TaskIQ High Failure Rate
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        # окно 30m: ретрай одной задачи пишет несколько task_failed на один
        # task_started — на коротком окне ratio улетает за 100% и мерит
        # бурст ретраев, а не деградацию очереди.
        expr: sum by (service) (rate({namespace="platform"} | json | message="task_failed" [30m])) / sum by (service) (rate({namespace="platform"}
          | json | message="task_started" [30m])) * 100
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        # объём запусков: без floor пара фейлов на почти пустой очереди
        # даёт высокий процент — шум, не сигнал.
        expr: sum by (service) (rate({namespace="platform"} | json | message="task_started" [30m]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 10 && $E > 0.02
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: High TaskIQ failure rate on {{ $labels.service }}
      description: Task failure rate is {{ printf "%.2f" $values.B.Value }}% for worker {{ $labels.service }} ({{ printf "%.3f" $values.E.Value }} starts/s)
    labels:
      severity: warning
  - uid: billing-settlement-errors
    title: Billing Settlement Errors
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        expr: sum(count_over_time({namespace="platform"} | json | message="idle.span_billing_settlement_tick" | level="ERROR" [15m])) > 0
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 15m
    keepFiringFor: 30m
    annotations:
      summary: Billing settlement errors detected
      description: '{{ printf "%.0f" $values.B.Value }} settlement errors in the last 15m — charges are being skipped'
    labels:
      severity: critical
      service: idle-worker
  - uid: payment-webhook-anomalies
    title: Payment Webhook Anomalies
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (message) (count_over_time({namespace="platform"} | json | message=~"payments.webhook_(invalid|provider_missing)" [15m])) > 3
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 0m
    keepFiringFor: 30m
    annotations:
      summary: 'Payment webhook anomalies: {{ $labels.message }}'
      description: '{{ printf "%.0f" $values.B.Value }} bad payment webhook events in 15m — signature failures or missing provider'
    labels:
      severity: warning
      service: frontend
  - uid: mail-sync-errors
    title: Mail Sync Errors
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        expr: sum(count_over_time({namespace="platform"} | json | message="idle.mail_sync_tick" | level="ERROR" [15m])) > 0
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 15m
    keepFiringFor: 30m
    annotations:
      summary: Mail sync errors detected
      description: '{{ printf "%.0f" $values.B.Value }} mailbox sync errors in 15m — bindings failing inside successful ticks'
    labels:
      severity: warning
      service: idle-worker
  - uid: company-init-failed
    title: Company Init Failed
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (message) (count_over_time({namespace="platform"} | json | message=~"company_init.(system_)?failed" [15m])) > 0
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 0m
    keepFiringFor: 60m
    annotations:
      summary: 'Company init failed: {{ $labels.message }}'
      description: '{{ printf "%.0f" $values.B.Value }} company init failures in 15m — new company onboarding is broken'
    labels:
      severity: critical
      service: idle-worker
  - uid: calendar-sync-errors
    title: Calendar Sync Errors
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        expr: sum(count_over_time({namespace="platform"} | json | message=~"idle.calendar_sync.*" | level="ERROR" [15m])) > 0
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 15m
    keepFiringFor: 30m
    annotations:
      summary: Calendar sync errors detected
      description: '{{ printf "%.0f" $values.B.Value }} calendar sync errors in 15m — integrations failing inside successful ticks'
    labels:
      severity: warning
      service: idle-worker
  - uid: llm-provider-sync-failed
    title: LLM Provider Sync Failed
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (provider) (count_over_time({namespace="platform"} | json | message="ai.provider_sync_failed" [1h]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 2
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 15m
    keepFiringFor: 60m
    annotations:
      summary: LLM provider {{ $labels.provider }} catalog sync failing
      description: '{{ printf "%.0f" $values.B.Value }} sync failures in 1h for provider {{ $labels.provider }} — model catalog drifting'
    labels:
      severity: warning
      service: idle-worker
  - uid: llm-errors
    title: LLM Errors
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (service) (count_over_time({namespace="platform"} | json | message=~"llm[.]api_error|llm[.]api_http_error|llm[.]invoke_error|clients[.]llm[.]stream[.]idle[.]timeout[.]s"
          [5m]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 10
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: High LLM error count on {{ $labels.service }}
      description: '{{ printf "%.0f" $values.B.Value }} LLM errors in the last 5 minutes'
    labels:
      severity: warning
  - uid: log-contract-violations
    title: Log Contract Violations
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 60
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (service) (count_over_time({namespace="platform"} | json | message="logging.contract_violation" [1m]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 1m
    annotations:
      summary: Log contract violation detected
      description: '{{ printf "%.0f" $values.B.Value }} contract violations in the last minute'
    labels:
      severity: critical
  - uid: crawl-url-failure-rate-high
    title: Crawl URL Failure Rate High
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        # контентные фейлы внешних сайтов (anti-bot, JS-only, 403/404 чужих
        # страниц) — норма работы краулера, а не инцидент платформы. Алерт
        # только при системном провале: >40% фейлов на нормальном потоке
        # 30 минут — это сломанный транспорт/браузер, не плохая выдача.
        expr: sum(rate({namespace="platform", service="search-worker"} | json | message="crawl.url.outcome" | crawl_outcome=~"failed|enrichment_failed"
          [30m])) / sum(rate({namespace="platform", service="search-worker"} | json | message="crawl.url.outcome" [30m])) * 100
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        expr: sum(rate({namespace="platform", service="search-worker"} | json | message="crawl.url.outcome" [30m]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 40 && $E > 0.02
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: High crawl URL failure rate on search-worker
      description: Crawl URL failure rate is {{ printf "%.2f" $values.B.Value }}% ({{ printf "%.3f" $values.E.Value }} outcomes/s)
    labels:
      severity: warning
  - uid: crawl-enrichment-failure-spike
    title: Crawl Enrichment Failure Spike
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        expr: sum(rate({namespace="platform", service="search-worker"} | json | message="crawl.enrich.failed" [15m])) / (sum(rate({namespace="platform",
          service="search-worker"} | json | message=~"crawl[.]enrich[.](completed|failed)" [15m])) + 1e-10) * 100
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        expr: sum(rate({namespace="platform", service="search-worker"} | json | message=~"crawl[.]enrich[.](completed|failed)" [15m]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 20 && $E > 0.02
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 15m
    annotations:
      summary: High crawl enrichment failure rate
      description: Enrichment failure rate is {{ printf "%.2f" $values.B.Value }}% at {{ printf "%.3f" $values.E.Value }} outcomes/s
    labels:
      severity: warning
  - uid: crawl-sitemap-errors
    title: Crawl Sitemap Discovery Errors
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum(rate({namespace="platform", service="search-worker"} | json | message="crawl.discover.failed" [5m])) * 60
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 5
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: Elevated crawl sitemap discovery failures
      description: 'Sitemap failures per minute: {{ printf "%.2f" $values.B.Value }}'
    labels:
      severity: warning
  - uid: mcp-error-rate-high
    title: MCP Error Rate High
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum(rate({namespace="platform", service=~"flows-worker"} | json | message="operation_finished" | operation_name="flows.mcp.tool_call"
          | operation_status="error" [5m])) / sum(rate({namespace="platform", service=~"flows-worker"} | json | message="operation_finished" |
          operation_name="flows.mcp.tool_call" [5m])) * 100
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        # объём вызовов: без floor одиночная ошибка на 1-2 вызовах даёт 50%+
        expr: sum(rate({namespace="platform", service=~"flows-worker"} | json | message="operation_finished" | operation_name="flows.mcp.tool_call" [5m]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        # >10% ошибок при объёме >=3 вызовов за окно (0.01/s): одиночная
        # ошибка на редком вызове не алертит — неинформативна.
        expression: $B > 10 && $E > 0.05
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: MCP tool call error rate > 10%
      description: MCP error rate is {{ printf "%.2f" $values.B.Value }}% ({{ printf "%.3f" $values.E.Value }} calls/s)
    labels:
      severity: warning
  - uid: seo-snapshot-failures
    title: SEO Snapshot Failures
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: loki
      model:
        expr: sum(count_over_time({namespace="platform", service="frontend"} | json | message=~"seo[.]snapshot[.].*failed" [15m]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 5
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: SEO snapshot pipeline degraded on frontend
      description: '{{ printf "%.0f" $values.B.Value }} seo.snapshot.*failed events in 15m — prerender broken, pages serve SPA shell (crawlers see degraded content)'
    labels:
      severity: warning
      service: frontend
  - uid: seo-artifacts-missing
    title: SEO Artifacts Missing
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 3600
        to: 0
      datasourceUid: loki
      model:
        # Артефактные seo.* события логируются один раз на процесс — одно
        # уже инцидент: seo-dist/documentation-dist не собран или не доехал
        # в образ, index.json битый, body.html поста отсутствует → sitemap
        # блога пустая, посты или вся документация 404.
        expr: sum(count_over_time({namespace="platform", service="frontend"} | json | message=~"seo[.](blog_(index_(missing|invalid)|body_missing)|documentation_dist_missing)" [1h]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B >= 1
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: SEO artifacts missing on frontend
      description: seo-dist/blog or documentation-dist artifacts missing or malformed — blog sitemap empty, post pages/public API degrade, or all documentation pages 404 (build step failed or assets missing in image)
    labels:
      severity: warning
      service: frontend
  - uid: seo-synth-failures
    title: SEO Synthetic Checks Failing
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        # CronJob seo-synth (*/15) пишет seo.smoke_failed в stdout — Loki
        # лейбл service=seo-synth берётся из pod label app.
        expr: sum(count_over_time({namespace="platform", service="seo-synth"} | json | message=~"seo[.]smoke_failed" [30m]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B >= 1
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: SEO synthetic smoke checks failing on linnex.io
      description: CronJob seo-synth runs scripts.seo.seo_smoke every 15m against the canonical origin — robots/sitemap/llms/canonical/snapshot/blog/docs/noindex. Failures mean crawlers currently see a broken surface.
    labels:
      severity: warning
      service: seo-synth
  - uid: seo-indexnow-failures
    title: SEO IndexNow Submission Failing
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 25200
        to: 0
      datasourceUid: loki
      model:
        # CronJob seo-indexnow (7 */6) пишет seo.indexnow_failed в stdout —
        # Loki лейбл service=seo-indexnow берётся из pod label app.
        expr: sum(count_over_time({namespace="platform", service="seo-indexnow"} | json | message=~"seo[.]indexnow_failed" [7h]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B >= 1
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 10m
    annotations:
      summary: SEO IndexNow submissions failing
      description: CronJob seo-indexnow submits all public URLs (registry + blog + docs sitemaps) to IndexNow every 6h. Failures mean search engines only discover new content via regular crawl.
    labels:
      severity: warning
      service: seo-indexnow
  - uid: seo-bot-crawl-silent
    title: SEO Bot Crawl Silent 72h
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 259200
        to: 0
      datasourceUid: loki
      model:
        # Хиты известных краулеров (bot=true) по seo.visit; seo-smoke и
        # пререндер снапшотов в визиты не попадают (UA-классификатор).
        expr: sum(count_over_time({namespace="platform", service="frontend", log_type="seo"} | json | message="seo.visit" | bot="true" [72h]))
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: loki
      model:
        # Страховка от мёртвого пайплайна: smoke-события есть → поверхность
        # и лог-стрим живы, значит ноль ботов — реальная тишина, а не обрыв.
        expr: sum(count_over_time({namespace="platform", service="seo-synth", log_type="seo"} | json | message=~"seo[.]smoke_.*" [24h]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B == 0 && $E > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 0m
    annotations:
      summary: No search/LLM crawler hits on public surface for 72h
      description: Zero bot=true seo.visit events on frontend for 72h while smoke checks confirm the surface and log pipeline are alive — engines stopped crawling (robots directive, indexing drop) or bot traffic routes elsewhere.
    labels:
      severity: warning
      service: frontend
  - uid: seo-visits-silent
    title: SEO Visitor Stream Silent 24h
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: loki
      model:
        # Человеческие визиты (bot=false) по seo.visit.
        expr: sum(count_over_time({namespace="platform", service="frontend", log_type="seo"} | json | message="seo.visit" | bot="false" [24h]))
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: loki
      model:
        expr: sum(count_over_time({namespace="platform", service="seo-synth", log_type="seo"} | json | message=~"seo[.]smoke_.*" [24h]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B == 0 && $E > 0
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 0m
    annotations:
      summary: No human visits on public surface for 24h
      description: Zero bot=false seo.visit events for 24h while seo-synth emits smoke events — either analytics middleware stopped emitting or the public site truly received no visitors in a day.
    labels:
      severity: warning
      service: frontend
  - uid: seo-report-failures
    title: SEO Telegram Report Failing
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 9000
        to: 0
      datasourceUid: loki
      model:
        # CronJob seo-report (*/1h) пишет seo.report_failed в stdout —
        # Loki лейбл service=seo-report берётся из pod label app.
        expr: sum(count_over_time({namespace="platform", service="seo-report"} | json | message=~"seo[.]report_failed" [2.5h]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B >= 1
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: SEO hourly Telegram report failing
      description: CronJob seo-report posts the hourly seo.visit digest to the alerts Telegram chat every hour. Failures mean Loki queries or the Telegram send are broken — report silence does not mean zero traffic.
    labels:
      severity: warning
      service: seo-report
  - uid: browser-cdp-disconnects
    title: Browser CDP Endpoint Flapping
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 1800
        to: 0
      datasourceUid: loki
      model:
        # sidecar chromium-cdp не имеет проб (CDP только loopback, в образе
        # нет wget/curl) — деградацию видит browser-app: каждый разрыв
        # DevTools-сокета выбрасывает handle с browser.cdp.disconnected_evicted.
        expr: sum(count_over_time({namespace="platform", service="browser"} | json | message=~"browser[.]cdp[.]disconnected_evicted" [30m]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
          expression: $B >= 3
          refId: C
          type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: Chromium CDP sidecar flapping on browser
      description: '{{ printf "%.0f" $values.B.Value }} CDP disconnects in 30m — chromium-cdp sidecar restarting or OOMing; crawl/SEO snapshot renders degrade or fail'
    labels:
      severity: warning
      service: browser
  - uid: seo-warmup-silent
    title: SEO Snapshot Warmup Silent
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 10800
        to: 0
      datasourceUid: loki
      model:
        # Периодический warmup (раз в час + на старте) закрывает каждый
        # цикл терминальным событием warmup_ok|warmup_failed|warmup_cycle_failed. Три часа
        # без события — таск мёртв: кэш протухает, ленивые хиты ждут
        # рендер, краулер видит shell. Фейлы цикла ловит seo-snapshot-failures.
        expr: sum(count_over_time({namespace="platform", service="frontend"} | json | message=~"seo[.]snapshot[.]warmup_(ok|failed|cycle_failed)" [3h]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
          expression: $B == 0
          refId: C
          type: math
    # Пустой результат sum() — и есть тишина: noData состояние это алерт.
    noDataState: Alerting
    execErrState: Error
    for: 30m
    annotations:
      summary: SEO snapshot warmup not running on frontend
      description: No seo.snapshot.warmup_ok|warmup_failed events in 3h — warmup task dead or frontend not emitting; snapshot cache goes stale, lazy hits wait full render, crawlers may see SPA shell
    labels:
      severity: warning
      service: frontend
  - uid: seo-synth-silent
    title: SEO Synth Cron Silent
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 7200
        to: 0
      datasourceUid: loki
      model:
        # seo-synth бежит */15м и каждый прогон печатает smoke_ok|smoke_failed.
        # Два часа без события — крон или пайплайн логов мёртв: деградация
        # SEO-поверхности пройдёт незамеченной вместе с её детектором.
        expr: sum(count_over_time({namespace="platform", service="seo-synth"} | json | message=~"seo[.]smoke_(ok|failed)" [2h]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
          expression: $B == 0
          refId: C
          type: math
    noDataState: Alerting
    execErrState: Error
    for: 30m
    annotations:
      summary: seo-synth CronJob stopped emitting results
      description: No seo.smoke_ok|smoke_failed in 2h — synthetic SEO checks not running; canonical/snapshot/docs/noindex regressions are currently undetected
    labels:
      severity: warning
      service: seo-synth
  - uid: seo-indexnow-silent
    title: SEO IndexNow Cron Silent
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 43200
        to: 0
      datasourceUid: loki
      model:
        # seo-indexnow (7 */6) шлёт submissions раз в 6 часов — терминальное
        # indexnow_ok|indexnow_failed|indexnow_skipped за прогон. 12 часов без
        # события — два пропущенных цикла: новые страницы открываются только
        # обходом. Окно from + range складывается в запрос к Loki, лимит 1d1h —
        # 12h+12h укладывается, 13h+13h уже нет.
        expr: sum(count_over_time({namespace="platform", service="seo-indexnow"} | json | message=~"seo[.]indexnow_(ok|failed|skipped)" [12h]))
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
          expression: $B == 0
          refId: C
          type: math
    noDataState: Alerting
    execErrState: Error
    for: 30m
    annotations:
      summary: seo-indexnow CronJob stopped emitting results
      description: No seo.indexnow_ok|indexnow_failed in 12h — IndexNow submissions not running; new pages/products/docs reach search engines only via regular crawl
    labels:
      severity: warning
      service: seo-indexnow
- orgId: 1
  name: platform_alerts_slow
  folder: Platform
  interval: 300s
  rules:
  - uid: slow-http-p99
    title: Slow HTTP P99
    condition: C
    data:
    - refId: A
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        # browser: render-латентность — сам продукт (nav до 30s), покрыт
        # отдельными алертами (CDP, fetch failures). /{full_path:path} —
        # SPA catch-all frontend: лидер-снапшот ждёт рендер до 45s by design
        # (stale-while-revalidate обслуживает остальных мгновенно).
        expr: quantile_over_time(0.99, {namespace="platform", service!="browser"} | json | message="http_request" | http_route!~"/[{]full_path:path[}]$|/health$"
          | unwrap http_duration_ms [5m]) by (service)
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum by (service) (rate({namespace="platform", service!="browser"} | json | message="http_request" | http_route!~"/[{]full_path:path[}]$|/health$" [5m]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 5000 && $E > 0.1
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
      summary: Slow HTTP P99 on {{ $labels.service }}
      description: P99 latency is {{ printf "%.0f" $values.B.Value }}ms for service {{ $labels.service }}
    labels:
      severity: warning
  - uid: flow-task-pickup-p99-high
    title: Flow Task Pickup P99 High
    condition: C
