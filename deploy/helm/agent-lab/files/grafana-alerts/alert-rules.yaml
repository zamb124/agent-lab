          | unwrap task_queue_wait_ms [5m])
        refId: A
    - refId: D
      queryType: instant
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: loki
      model:
        expr: sum(count_over_time({namespace="platform", service=~"flows-worker"} | json | message="task_started" | task_name="process_flow_task" [5m]))
        refId: D
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: E
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: D
        reducer: last
        refId: E
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        expression: $B > 30000 && $E >= 10
        refId: C
        type: math
    noDataState: OK
    execErrState: Error
    for: 5m
    annotations:
