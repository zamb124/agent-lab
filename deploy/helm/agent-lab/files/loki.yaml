auth_enabled: false

server:
  http_listen_port: 3100
  grpc_server_max_recv_msg_size: 20971520
  grpc_server_max_send_msg_size: 20971520

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  retention_period: 24h  # логи — максимум сутки (короткий горизонт)
  # Лёгкий стек: режем длинные/тяжёлые запросы, которые укладывали
  # алерт-движок в DeadlineExceeded.
  max_query_length: 25h
  max_query_lookback: 0s
  max_entries_limit_per_query: 5000
  # Панели redis inventory топ-N префиксов разворачивают >500 серий
  # (redis_db × prefix) до агрегации max by — поднимаем потолок до 2000.
  max_query_series: 2000
  split_queries_by_interval: 1h
  max_cache_freshness_per_query: 5m

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  compaction_interval: 10m
  delete_request_store: filesystem
