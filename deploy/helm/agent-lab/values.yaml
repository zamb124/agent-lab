litserve:
  enabled: true
  # ВАЖНО: provider-litserve использует ОТДЕЛЬНЫЙ image на Python 3.14 (GIL build),
  # потому что torchaudio (через silero_vad), torch+CUDA, transformers и пр.
  # пока НЕ публикуют cp314t wheels (free-threaded ABI). Stable-ABI .so из GIL-build
  # физически не загружается в free-threaded интерпретатор (PEP 703).
  # Главный image платформы остаётся на 3.14t. См. .cursor/rules/infrastructure.mdc
  # раздел "ML GIL resurrection" и Dockerfile.gpu / Dockerfile.base.gpu.
  image: ""  # переопределяется в .github/workflows/deploy.yml через --set litserve.image=...
  # Имя из gpuNodeNames → nvidia.com/gpu. Сейчас GPU на master.
  nodeName: master
  port: 8014
  serviceName: provider-litserve
  # PVC под HF cache: GigaAM v3 (~3 Gi), Silero TTS v5 (~150 Mi), Silero VAD (~50 Mi),
  # Qwen3-Embedding-0.6B, Qwen3-Reranker-0.6B + запас
  # (gigaam/silero-tts/silero-vad/qwen/flagllm) → берём 100Gi.
  modelCacheSize: 100Gi
  rerankModelId: Qwen/Qwen3-Reranker-0.6B
  embeddingModelId: Qwen/Qwen3-Embedding-0.6B
  # Загружать embedding-модель в bfloat16 (экономия ~50% VRAM на RTX A2000 6GB).
  # Отключить: embeddingUseBf16: "false"
  embeddingUseBf16: "true"
  resources:
    # requests ужаты под single-node master (8 cpu / 31Gi allocatable): фактический
    # RSS ~3.4Gi на под, инференс GPU-bound — CPU-запрос нужен только для планирования.
    # limits шире requests: под бёрстит до limit, когда нода свободна.
    requests:
      cpu: 250m
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 28Gi

# NVIDIA k8s-device-plugin DaemonSet публикует nvidia.com/gpu в Allocatable.
# Host-драйвер и containerd drop-in ставит deploy/scripts/bootstrap-nvidia.sh.
nvidiaDevicePlugin:
  enabled: true
  image: nvcr.io/nvidia/k8s-device-plugin
  tag: v0.20.1

centrifugo:
  enabled: true
  nodeName: master
  image: centrifugo/centrifugo:v6.10.2
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  redis:
    nodeName: master
    image: redis:8.8.4-alpine
    maxmemory: 512mb
    storage: 5Gi
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 768Mi

livekit:
  enabled: true
  nodeName: master
  image: livekit/livekit-server:v1.13.11
  imagePullPolicy: IfNotPresent
  apiKey: devkey
  publicUrl: wss://livekit.linnex.io
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 1Gi

livekitEgress:
  enabled: true
  nodeName: master
  image: livekit/egress:v1.15.0
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 4Gi

coturn:
  enabled: true
  nodeName: master
  image: coturn/coturn:4.18.0
  realm: agentlab
  minPort: 49152
  maxPort: 65535
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi

onlyoffice:
  enabled: true
  nodeName: master
  image: onlyoffice/documentserver:10.0.0.1
  publicUrl: https://onlyoffice.linnex.io
  # Platform OpenAI-compatible LLM proxy (browser → flows). Addon v1 добавляет плагин.
  ai:
    enabled: true
    llmApiBaseUrl: https://linnex.io/flows/api/v1/llm
    proxyUrl: https://linnex.io/flows/api/v1/llm/v1/proxy
    providerDisplayName: Linnex LLMs
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi

observability:
  loki:
    enabled: true
    nodeName: master
    image: grafana/loki:3.7.9
    storage: 100Gi
  tempo:
    enabled: true
    nodeName: master
    image: grafana/tempo:2.10.10
    storage: 50Gi
  grafana:
    enabled: true
    nodeName: master
    image: grafana/grafana:13.3.0
    publicUrl: https://grafana.linnex.io
  alloy:
    enabled: true
    image: grafana/alloy:v1.21.3

ingress:
  enabled: true
  # Аддон ingress в MicroK8s = traefik, IngressClass "public".
  className: public
  platformDomains:
    - apexHost: linnex.io
      wildcardHost: "*.linnex.io"
    - apexHost: linnex.io
      wildcardHost: "*.linnex.io"
  dedicatedSubdomains:
    - subdomain: livekit
    - subdomain: onlyoffice
    - subdomain: grafana
  proxyBodySize: 100m

