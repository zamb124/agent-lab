workers:
  flows-worker:
    nodeName: master
    enabled: true
    # 1 реплика: single-node master (8 cpu) не вмещает вторую параллельно с
    # provider-litserve. --workers 2 (не 4): нода на пределе по RAM — каждый
    # taskiq-воркер это +~450MB RSS полного app-процесса.
    replicas: 1
    terminationGracePeriodSeconds: 300
    command:
      [
        "taskiq",
        "worker",
        "apps.flows.worker:worker_app",
        "--workers",
        "2",
      ]
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 4Gi
  scheduler:
    nodeName: master
    enabled: true
