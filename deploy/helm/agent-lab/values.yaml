# Дефолтные значения чарта Платформы. Production-overrides — values-prod.yaml.

namespace: platform

image:
  repository: ghcr.io/zamb124/agent-lab
  # Обязательно задаётся в production как immutable release tag (обычно short SHA).
  # latest запрещён: от image.tag зависит SERVER__DEPLOYMENT_VERSION и PWA-инвалидация статики.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# Публичный domain для Ingress + сервисных URL платформы (TURN, office callback, VAPID).
domain: linnex.io

# Primary apex для SERVER__PLATFORM_PUBLIC_BASE_URL (NotificationURL Т-Банка, short links).
# Не подменять domain: от domain зависят CALLS__TURN_HOST / OFFICE callback / PUSH__VAPID_EMAIL.
publicBaseHost: linnex.io

# Лейбл, которым размечается GPU-нода (kubectl label node <name> accelerator=nvidia-gpu).
gpuNodeSelectorKey: accelerator
gpuNodeSelectorValue: nvidia-gpu

# hostname нод с GPU. LitServe на имени из списка получает nvidia.com/gpu.
# Одна нода master: GPU на той же машине, без taint dedicated=gpu.
gpuNodeNames:
  - master

guestRuntime:
  executor: docker
  registry:
    size: 20Gi

storageClassName: microk8s-hostpath

postgres:
  nodeName: master
  image: pgvector/pgvector:0.8.7-pg18
  storage: 50Gi
  resources:
    requests:
      cpu: 300m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  maxConnections: 1000
  sharedBuffers: 2GB

openfga:
  enabled: true
  nodeName: master
  image: openfga/openfga:v1.22.1
  replicas: 1
  # Pin ids: CI/`make k8s-deploy` → openfga_bootstrap_cluster.sh → Secret openfga-ids + --set.
  # Пока storeId/authorizationModelId пусты, OPENFGA__ENABLED у apps = false (server всё равно поднимается).
  storeId: ""
  authorizationModelId: ""
  # Cache off по умолчанию → сильная консистентность Check без HIGHER_CONSISTENCY.
  checkQueryCacheEnabled: false
  cacheControllerEnabled: false
  # Default OpenFGA request deadline is 3s — мало под parallel pytest dual-write.
  requestTimeout: 30s
  # Без лимита 50 параллельных Check × unbounded datastore reads валят Postgres/healthz.
  maxConcurrentChecksPerBatchCheck: "10"
  maxConcurrentReadsForCheck: "16"
  # kubelet default timeoutSeconds=1; /healthz при медленном datastore не укладывается → Killing.
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

redis:
  nodeName: master
  image: redis:8.8.4-alpine
  storage: 10Gi
  resources:
    # RDB на диске ~1.9–2.5 Gi; при старте пик RSS + AOF rewrite. 2Gi limits → OOMKilled (exit 137).
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      cpu: "1"
      memory: 4Gi

seaweedfs:
  nodeName: master
  image: chrislusf/seaweedfs:4.51
  storage: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# ConfigMap app-conf собирается make render-helm-app-conf из conf.json + overlay.
# Межсервисные URL в кластере выставляются ENV SERVER__*_SERVICE_URL в templates/_helpers.tpl.
appConfigConfigMap: app-conf

# Глобальные переменные окружения для всех подов приложения и воркеров.
# Поверх задаются конкретные SERVER__HOST/PORT в каждом Deployment.
appCommonEnv:
  databasePrefix: postgres
  redisService: redis
  redisPort: 6379
  postgresService: postgres
  postgresPort: 5432
  # Только если публичный webhook flows не {platform_public_base_url}/flows (редкий случай).
  flowsWebhookPublicBaseUrl: ""

