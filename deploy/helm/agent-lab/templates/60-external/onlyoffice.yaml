{{- if .Values.onlyoffice.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onlyoffice-theme
  namespace: {{ .Values.namespace }}
data:
  theme-platform-docs-light.json: |-
{{ .Files.Get "files/onlyoffice-theme.json" | indent 4 }}
{{- if .Values.onlyoffice.ai.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: onlyoffice-ai
  namespace: {{ .Values.namespace }}
data:
  onlyoffice-ai-local-fragment.json: |-
{{ .Files.Get "files/onlyoffice-ai-local-fragment.json" | indent 4 }}
{{- /* Scripts via AsConfig — без indent на shebang. */}}
{{ (.Files.Glob "files/onlyoffice_*.sh").AsConfig | indent 2 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: onlyoffice
  namespace: {{ .Values.namespace }}
  labels:
    app: onlyoffice
spec:
  type: ClusterIP
  selector:
    app: onlyoffice
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onlyoffice
  namespace: {{ .Values.namespace }}
  labels:
    app: onlyoffice
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: onlyoffice
  template:
    metadata:
      labels:
        app: onlyoffice
    spec:
{{- include "agentlab.nodeSchedule" (list . .Values.onlyoffice.nodeName) | nindent 6 }}
      containers:
        - name: documentserver
          image: {{ .Values.onlyoffice.image }}
          imagePullPolicy: IfNotPresent
{{- if .Values.onlyoffice.ai.enabled }}
          command: ["/bin/bash", "/opt/platform/onlyoffice_ds_entrypoint.sh"]
{{- end }}
          env:
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.platformSecretName }}
                  key: onlyoffice-jwt-secret
{{- if .Values.onlyoffice.ai.enabled }}
            - name: ONLYOFFICE_AI_FRAGMENT_PATH
              value: /opt/platform/onlyoffice-ai-local-fragment.json
            - name: ONLYOFFICE_APPLY_AI_SCRIPT
              value: /opt/platform/onlyoffice_apply_ai_settings.sh
            - name: PLATFORM_LLM_BASE_URL
              value: {{ .Values.onlyoffice.ai.llmApiBaseUrl | quote }}
            - name: PLATFORM_LLM_PROXY_URL
              value: {{ .Values.onlyoffice.ai.proxyUrl | quote }}
            - name: PLATFORM_LLM_PROVIDER_NAME
              value: {{ .Values.onlyoffice.ai.providerDisplayName | quote }}
{{- end }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: theme
              mountPath: /var/www/onlyoffice/documentserver/web-apps/apps/common/main/resources/themes/theme-platform-docs-light.json
              subPath: theme-platform-docs-light.json
              readOnly: true
{{- if .Values.onlyoffice.ai.enabled }}
            - name: onlyoffice-ai
              mountPath: /opt/platform
              readOnly: true
{{- end }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.onlyoffice.resources | nindent 12 }}
      volumes:
        - name: theme
          configMap:
            name: onlyoffice-theme
{{- if .Values.onlyoffice.ai.enabled }}
        - name: onlyoffice-ai
          configMap:
            name: onlyoffice-ai
            defaultMode: 0755
{{- end }}
{{- end }}
