{{- if index .Values.applications "geo" }}
{{- $app := index .Values.applications "geo" }}
{{- if $app.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: geo-tiles
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storageClassName }}
  resources:
    requests:
      storage: {{ $app.tiles.size }}
{{- end }}
{{- end }}
