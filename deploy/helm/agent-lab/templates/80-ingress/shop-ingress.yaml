{{- if .Values.ingress.enabled }}
{{- $platformDomains := .Values.ingress.platformDomains | default (list (dict "apexHost" .Values.ingress.apexHost "wildcardHost" .Values.ingress.wildcardHost)) }}
{{- $shop := index .Values.applications "shop" }}
{{- if and $shop $shop.enabled }}
{{- /*
  Публичная поверхность shop — точный хост агрегатора shop.<apex> на каждом
  platform-домене: / — агрегатор, /s/{slug} — витрина (HostMiddleware внутри
  сервиса переписывает на API-пути). Wildcard *.<apex> на shop невозможен:
  slug-пространство неотличимо от компанийских поддоменов (Company.subdomain
  динамический), а wildcard-vs-wildcard в Traefik отдаёт все компанийские
  поддомены в shop — сломанный /dashboard и логины.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-shop-storefront
  namespace: {{ .Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "5"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Values.namespace }}-compress@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        {{- range $platformDomains }}
        - {{ printf "shop.%s" .apexHost | quote }}
        {{- end }}
      secretName: platform-tls
  rules:
    {{- range $platformDomains }}
    - host: {{ printf "shop.%s" .apexHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $shop.serviceName }}
                port:
                  number: {{ $shop.port }}
    {{- end }}
{{- end }}
{{- end }}
