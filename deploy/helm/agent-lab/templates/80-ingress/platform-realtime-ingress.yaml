{{- if and .Values.ingress.enabled .Values.centrifugo.enabled }}
{{- $platformDomains := .Values.ingress.platformDomains | default (list (dict "apexHost" .Values.ingress.apexHost "wildcardHost" .Values.ingress.wildcardHost)) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-realtime
  namespace: {{ .Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "30"
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Values.namespace }}-realtime-strip@kubernetescrd"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        {{- range $platformDomains }}
        - {{ .apexHost | quote }}
        - {{ .wildcardHost | quote }}
        {{- end }}
      secretName: platform-tls
  rules:
    {{- range $platformDomains }}
    {{- range $host := list .apexHost .wildcardHost }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /realtime
            pathType: Prefix
            backend:
              service:
                name: centrifugo
                port:
                  number: 8000
    {{- end }}
    {{- end }}
{{- end }}
