{{- if and .Values.ingress.enabled .Values.onlyoffice.enabled }}
{{- $platformDomains := .Values.ingress.platformDomains | default (list (dict "apexHost" .Values.ingress.apexHost "wildcardHost" .Values.ingress.wildcardHost)) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onlyoffice
  namespace: {{ .Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1000"
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Values.namespace }}-onlyoffice-forwarded-headers@kubernetescrd"
  # secretName platform-tls выпускается deploy/scripts/setup-wildcard-tls.sh.
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        {{- range $platformDomains }}
        - {{ printf "onlyoffice.%s" .apexHost | quote }}
        {{- end }}
      secretName: platform-tls
  rules:
    {{- range $platformDomains }}
    - host: {{ printf "onlyoffice.%s" .apexHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: onlyoffice
                port:
                  number: 80
    {{- end }}
{{- end }}
