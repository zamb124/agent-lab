{{- if and .Values.ingress.enabled .Values.livekit.enabled }}
{{- $platformDomains := .Values.ingress.platformDomains | default (list (dict "apexHost" .Values.ingress.apexHost "wildcardHost" .Values.ingress.wildcardHost)) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: livekit
  namespace: {{ .Values.namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.priority: "1000"
  # secretName platform-tls выпускается deploy/scripts/setup-wildcard-tls.sh.
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        {{- range $platformDomains }}
        - {{ printf "livekit.%s" .apexHost | quote }}
        {{- end }}
      secretName: platform-tls
  rules:
    {{- range $platformDomains }}
    - host: {{ printf "livekit.%s" .apexHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: livekit
                port:
                  number: 7880
    {{- end }}
{{- end }}
