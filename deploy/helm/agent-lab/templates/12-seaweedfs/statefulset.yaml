apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: {{ .Values.namespace }}
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
{{- include "agentlab.nodeSchedule" (list . .Values.seaweedfs.nodeName) | nindent 6 }}
      containers:
        - name: seaweedfs
          image: {{ .Values.seaweedfs.image }}
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -filer
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -metricsPort=9327
            - -volume.max=0
            - -master.volumeSizeLimitMB=6144
          ports:
            - name: api
              containerPort: 8333
            - name: filer
              containerPort: 8888
            - name: metrics
              containerPort: 9327
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.seaweedfs.resources | nindent 12 }}
      volumes:
        - name: s3-config
          secret:
            secretName: seaweedfs-s3-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.seaweedfs.storage }}
