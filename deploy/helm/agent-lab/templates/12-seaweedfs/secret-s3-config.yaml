apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-config
  namespace: {{ .Values.namespace }}
  labels:
    app: seaweedfs
type: Opaque
stringData:
  s3.json: |
    {"identities":[{"name":"platform","credentials":[{"accessKey":{{ .Values.platformSecrets.s3AccessKey | toJson }},"secretKey":{{ .Values.platformSecrets.s3SecretKey | toJson }}}],"actions":["Admin","Read","Write","List","Tagging"]}]}
