name: agentlab-test

services:
  postgres-test:
    platform: "linux/amd64"
    image: pgvector/pgvector:0.8.7-pg18
    container_name: agentlab_postgres_test
    environment:
      POSTGRES_DB: platform_shared
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: admin
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "54322:5432"
    shm_size: 1g
    volumes:
      - postgres-test-data:/var/lib/postgresql
      - ./migrations/postgres/init.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
      - ./reports/postgres-test-logs:/var/log/postgresql
    command: >
      postgres
      -c max_connections=800
      -c shared_preload_libraries=pg_stat_statements,auto_explain
      -c pg_stat_statements.track=all
      -c pg_stat_statements.max=10000
      -c auto_explain.log_min_duration=100ms
      -c auto_explain.log_analyze=true
      -c auto_explain.log_buffers=true
      -c auto_explain.log_format=json
      -c auto_explain.log_nested_statements=true
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_shared"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-net

  redis-test:
    platform: "linux/amd64"
    image: redis:8.8.4-alpine
    container_name: agentlab_redis_test
    ports:
      - "63792:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-net

  redis-realtime-test:
    platform: "linux/amd64"
    image: redis:8.8.4-alpine
    container_name: agentlab_redis_realtime_test
    ports:
      - "63793:6379"
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-net

  centrifugo-test:
    platform: "linux/amd64"
    image: centrifugo/centrifugo:v6.10.2
    container_name: agentlab_centrifugo_test
    depends_on:
      redis-realtime-test:
        condition: service_healthy
    ports:
      - "19000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: platform-test-hs256-jwt-secret-32b!
      CENTRIFUGO_HTTP_API_KEY: platform-test-centrifugo-http-api-key
    volumes:
      - ./deploy/centrifugo/config.test.json:/centrifugo/config.json:ro
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8000/health"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - test-net

  seaweedfs-test:
    platform: "linux/amd64"
    image: chrislusf/seaweedfs:4.51
    container_name: agentlab_seaweedfs_test
    ports:
      - "19002:8333"
    volumes:
      - ./deploy/seaweedfs/s3-test.json:/etc/seaweedfs/s3.json:ro
    command: server -dir=/data -ip.bind=0.0.0.0 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=2048
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-net

  seaweedfs-test-ext:
    platform: "linux/amd64"
    image: chrislusf/seaweedfs:4.51
    container_name: agentlab_seaweedfs_ext_test
    ports:
      - "19003:8333"
    volumes:
      - ./deploy/seaweedfs/s3-test-ext.json:/etc/seaweedfs/s3.json:ro
    command: server -dir=/data -ip.bind=0.0.0.0 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=2048
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-net

  openfga-migrate-test:
    platform: "linux/amd64"
    image: openfga/openfga:v1.22.1
    container_name: agentlab_openfga_migrate_test
    depends_on:
      postgres-test:
        condition: service_healthy
    command:
      - migrate
      - --datastore-engine
      - postgres
      - --datastore-uri
      - postgres://platform_user:admin@postgres-test:5432/openfga?sslmode=disable
    networks:
      - test-net
    restart: "no"

  openfga-test:
    platform: "linux/amd64"
    image: openfga/openfga:v1.22.1
    container_name: agentlab_openfga_test
    depends_on:
      openfga-migrate-test:
        condition: service_completed_successfully
    command:
      - run
      - --datastore-engine
      - postgres
      - --datastore-uri
      - postgres://platform_user:admin@postgres-test:5432/openfga?sslmode=disable
      - --http-addr
      - 0.0.0.0:8080
      - --grpc-addr
      - 0.0.0.0:8081
      - --playground-enabled=false
      - --request-timeout
      - 30s
      - --max-concurrent-checks-per-batch-check
      - "10"
      - --max-concurrent-reads-for-check
      - "16"
    ports:
      - "9093:8080"
      - "9094:8081"
    restart: unless-stopped
    networks:
      - test-net

  # OnlyOffice Document Server — те же JWT и URL, что в tests_runner (OFFICE__*).
  onlyoffice-documentserver:
    platform: "linux/amd64"
    image: onlyoffice/documentserver:10.0.0.1
    container_name: agentlab_onlyoffice_test
    ports:
      - "18088:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=test-onlyoffice-jwt-secret
      - PLATFORM_LLM_BASE_URL=http://localhost:8002/flows/api/v1/llm
      - PLATFORM_LLM_PROXY_URL=http://localhost:8002/flows/api/v1/llm/v1/proxy
      - PLATFORM_LLM_PROVIDER_NAME=Linnex LLMs
      - ONLYOFFICE_AI_FRAGMENT_PATH=/opt/platform/onlyoffice-ai-local-fragment.json
      - ONLYOFFICE_APPLY_AI_SCRIPT=/opt/platform/onlyoffice_apply_ai_settings.sh
    command: ["/bin/bash", "/opt/platform/onlyoffice_ds_entrypoint.sh"]
    volumes:
      - ./deploy/helm/agent-lab/files/onlyoffice-theme.json:/var/www/onlyoffice/documentserver/web-apps/apps/common/main/resources/themes/theme-platform-docs-light.json:ro
      - ./deploy/helm/agent-lab/files/onlyoffice-ai-local-fragment.json:/opt/platform/onlyoffice-ai-local-fragment.json:ro
      - ./deploy/helm/agent-lab/files/onlyoffice_apply_ai_settings.sh:/opt/platform/onlyoffice_apply_ai_settings.sh:ro
      - ./deploy/helm/agent-lab/files/onlyoffice_ds_entrypoint.sh:/opt/platform/onlyoffice_ds_entrypoint.sh:ro
    depends_on:
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - test-net

  provider_litserve:
    platform: "linux/amd64"
    image: ${AGENT_LAB_IMAGE:-ghcr.io/zamb124/agent-lab:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: full
    container_name: agentlab_provider_litserve_test
    command: ["python", "-m", "apps.provider_litserve.main"]
    ports:
      - "18014:8014"
    volumes:
      - ./conf.json:/app/conf.json:ro
    environment:
      - PROVIDER_LITSERVE__INFRA__BACKEND=placeholder
      - PROVIDER_LITSERVE__INFRA__HOST=0.0.0.0
      - PROVIDER_LITSERVE__INFRA__GATEWAY_PORT=8014
      - TRACING__OTLP_ENDPOINT=http://alloy-test:4317
    depends_on:
      redis-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - test-net

  test-a2a-agent:
    platform: "linux/amd64"
    image: ${AGENT_LAB_TEST_A2A_IMAGE:-ghcr.io/zamb124/agent-lab-test-a2a:local}
    build:
      context: .
      dockerfile: apps/test_a2a_sample/Dockerfile
    container_name: agentlab_a2a_test
    ports:
      - "18052:8005"
    environment:
      - API_KEY=test-api-key-12345
      - AGENT_URL=http://test-a2a-agent:8005
      - PORT=8005
      - LLM__OPENAI__API_KEY=${LLM__OPENAI__API_KEY:-sk-test-fake-key-for-testing}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - test-net

  # TaskIQ воркеры (flows_worker, rag_worker, scheduler, sync_worker, crm_worker,
  # idle_worker) запускаются ТОЛЬКО локальным subprocess из tests/fixtures/workers.py
  # (или изнутри tests_runner). Контейнеры в test-compose «запекают» код в образ
  # и приводят к double-consumer гонке на общей Redis-очереди при изменениях
  # моделей/handler'ов. Канон — один источник правды: текущий рабочий код.

  tests_runner:
    platform: "linux/amd64"
    image: ${AGENT_LAB_TEST_IMAGE:-ghcr.io/zamb124/agent-lab-test:local}
    build:
      context: .
      dockerfile: Dockerfile.test
      target: default
      args:
        TEST_BASE_IMAGE: ${TEST_BASE_IMAGE:-ghcr.io/zamb124/agent-lab-test-base:latest}
    container_name: agentlab_tests_runner
    depends_on:
      redis-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
      seaweedfs-test:
        condition: service_healthy
      test-a2a-agent:
        condition: service_healthy
      provider_litserve:
        condition: service_healthy
      livekit-test:
        condition: service_healthy
      centrifugo-test:
        condition: service_healthy
      onlyoffice-documentserver:
        condition: service_healthy
      loki-test:
        condition: service_started
      tempo-test:
        condition: service_started
      alloy-test:
        condition: service_started
      grafana-test:
        condition: service_started
    environment:
      - DATABASE__SHARED_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_shared
      - DATABASE__FLOWS_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_agents
      - DATABASE__CRM_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_crm
      - DATABASE__SYNC_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_sync
      - DATABASE__RAG_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_rag
      - DATABASE__OFFICE_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_office
      - DATABASE__TRACING_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_tracing
      - DATABASE__SECRETS_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_secrets
      - SECRETS__ENCRYPTION_KEY=test-secrets-encryption-key-fixed
      - DATABASE__WIKI_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_wiki
      - DATABASE__REALTIME_URL=postgresql+asyncpg://platform_user:admin@postgres-test:5432/platform_realtime
      - DATABASE__REDIS_URL=redis://redis-test:6379/0
      - TASKS__BROKER_URL=redis://redis-test:6379/1
      - TESTING=true
      - AUTH__INTERNAL_SERVICE_KEY=test-internal-service-key
      - AUTH__ADMIN_API_KEY=test-admin-api-key
      - EXTERNAL_TEST_A2A_AGENT_URL=http://test-a2a-agent:8005
      - EXTERNAL_TEST_A2A_AGENT_API_KEY=test-api-key-12345
      - PYTEST_WORKERS=${PYTEST_WORKERS:-4}
      - S3__ENABLED=true
      - S3__ENDPOINT_URL=http://seaweedfs-test:8333
      - S3__BUCKET_NAME=test-bucket
      - S3__ACCESS_KEY_ID=s3admin
      - S3__SECRET_ACCESS_KEY=s3admin
      - S3__PROVIDER=seaweedfs
      - S3__PATH_STYLE=true
      - CALLS__LIVEKIT_URL=ws://livekit-test:7880
      - CALLS__LIVEKIT_API_KEY=devkey
      - CALLS__LIVEKIT_API_SECRET=platform-test-livekit-secret-32b!
      - VOICE__STT__PROVIDER=mock
      - VOICE__STT__MOCK_TRANSCRIPT_TEXT=Тестовая транскрипция docker worker
      - OFFICE__JWT_SECRET=test-onlyoffice-jwt-secret
      - OFFICE__DOCUMENT_SERVER_PUBLIC_URL=http://onlyoffice-documentserver
      - OFFICE__CALLBACK_PUBLIC_BASE_URL=http://testserver
      - PROVIDER_LITSERVE__API__BASE_URL=http://provider_litserve:8014/v1
      - SERVER__SEARCH_SERVICE_URL=http://localhost:9010
      - SERVER__CAPABILITY_GATEWAY_SERVICE_URL=http://localhost:9016
      - SERVER__CODE_RUNNER_PYTHON_SERVICE_URL=http://localhost:9017
      - SERVER__CODE_RUNNER_NODE_SERVICE_URL=http://localhost:9018
      - SERVER__CODE_RUNNER_GO_SERVICE_URL=http://localhost:9019
      - SERVER__CODE_RUNNER_CSHARP_SERVICE_URL=http://localhost:9020
      - SERVER__WIKI_SERVICE_URL=http://localhost:9023
      - SERVER__GUEST_RUNTIME_SERVICE_URL=http://localhost:9024
      - SERVER__REALTIME_SERVICE_URL=http://localhost:9025
      - REALTIME__CENTRIFUGO_API_URL=http://centrifugo-test:8000/api
      - REALTIME__CENTRIFUGO_API_KEY=platform-test-centrifugo-http-api-key
      - CENTRIFUGO_WS_URL=ws://centrifugo-test:8000/connection/websocket
      - TRACING__OTLP_ENDPOINT=http://alloy-test:4317
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "test -d /app/test-results || mkdir -p /app/test-results; test -d /app/htmlcov || mkdir -p /app/htmlcov; chmod -R 777 /app/test-results /app/htmlcov 2>/dev/null || true; python -m pytest tests/ -v -n ${PYTEST_WORKERS} --junitxml=/app/test-results/junit.xml --cov=apps --cov=core --cov-report=term-missing --cov-report=html"]
    restart: "no"
    volumes:
      - ./test-results:/app/test-results:rw
      - ./htmlcov:/app/htmlcov:rw
    networks:
      - test-net

  livekit-test:
    image: livekit/livekit-server:v1.13.11
    container_name: agentlab_livekit_test
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        keys:
          devkey: platform-test-livekit-secret-32b!
        redis:
          address: redis-test:6379
          db: 2
        rtc:
          tcp_port: 7882
          udp_port: 7881
          use_external_ip: false
    command: --bind 0.0.0.0
    ports:
      - "7890:7880"
      - "7891:7881/udp"
      - "7892:7882/tcp"
    depends_on:
      redis-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:7880"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - test-net

  livekit-egress-test:
    image: livekit/egress:v1.15.0
    container_name: agentlab_livekit_egress_test
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: platform-test-livekit-secret-32b!
        ws_url: ws://livekit-test:7880
        redis:
          address: redis-test:6379
          db: 2
        logging:
          level: info
          json: true
        session_limits:
          file_output_max_duration: 1h
    depends_on:
      redis-test:
        condition: service_healthy
      livekit-test:
        condition: service_healthy
    restart: "no"
    networks:
      - test-net

  livekit-cli-test:
    image: livekit/livekit-cli:v2.19.2
    container_name: agentlab_livekit_cli_test
    command:
      [
        "--url",
        "ws://livekit-test:7880",
        "--api-key",
        "devkey",
        "--api-secret",
        "platform-test-livekit-secret-32b!",
        "room",
        "join",
        "--identity",
        "cli-bootstrap",
        "--publish-demo",
        "cli-bootstrap-room"
      ]
    depends_on:
      livekit-test:
        condition: service_healthy
    restart: "no"
    networks:
      - test-net

  # ============================================
  # Observability (Loki + Tempo + Alloy + Grafana)
  # Порты смещены чтобы не конфликтовать с dev
  # ============================================
  loki-test:
    image: grafana/loki:3.7.9
    container_name: agentlab_loki_test
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ./deploy/helm/agent-lab/files/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "3110:3100"
    networks:
      test-net:
        aliases:
          - loki

  tempo-test:
    image: grafana/tempo:2.10.10
    container_name: agentlab_tempo_test
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./deploy/helm/agent-lab/files/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "3210:3200"
    networks:
      test-net:
        aliases:
          - tempo

  alloy-test:
    image: grafana/alloy:v1.21.3
    container_name: agentlab_alloy_test
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./deploy/observability/alloy.config:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "4327:4317"
      - "12355:12345"
    depends_on:
      loki-test:
        condition: service_started
      tempo-test:
        condition: service_started
    networks:
      - test-net

  grafana-test:
    image: grafana/grafana:13.3.0
    container_name: agentlab_grafana_test
    environment:
      GF_SERVER_ROOT_URL: "http://localhost:3010"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./deploy/helm/agent-lab/files/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/ds.yaml:ro
      - ./deploy/helm/agent-lab/files/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./deploy/helm/agent-lab/files/dashboards:/etc/grafana/provisioning/dashboards/platform:ro
      - ./deploy/helm/agent-lab/files/grafana-alerts:/etc/grafana/provisioning/alerting:ro
    ports:
      - "3010:3000"
    depends_on:
      loki-test:
        condition: service_started
    networks:
      - test-net

networks:
  test-net:
    driver: bridge

volumes:
  postgres-test-data:
