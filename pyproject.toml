[project]
name = "agent-lab"
version = "0.1.0"
description = "Agent Platform - платформа агентских систем"
license = "Elastic-2.0"
# Python 3.14 — single target. Локально на macOS: 3.14 GIL build (cp314). В Docker:
# 3.14t free-threaded (cp314t), закрепляется в Dockerfile + Helm PYTHON_GIL=0.
# requires-python оставляем диапазоном, чтобы оба ABI считались валидными.
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-auth>=2.62.0",
    "greenlet>=3.5.6",
    "num2words>=0.5.14",
    "pyahocorasick>=2.3.1",
    "playwright-stealth>=2.0.3",
    "pywebpush>=2.5.0",
    "reportlab>=5.1.0",
    "xlrd>=2.0.2",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "linkify-it-py>=2.2.0",
    "asyncmy>=0.2.17",
    "clickhouse-connect>=1.11.0",
    "oxyde>=0.8.0",
]
[tool.uv]
default-groups = [
    "core",
    "agents",
    "worker-base",
    "rag-worker",
    "crm",
    "rag",
    "sync",
    "dev",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]

[tool.hatch.build.targets.wheel.force-include]
"core/files/writer/fonts/NotoSans-Regular.ttf" = "core/files/writer/fonts/NotoSans-Regular.ttf"
"core/files/writer/fonts/OFL.txt" = "core/files/writer/fonts/OFL.txt"
"core/clients/payment/certs/russian_trusted_root_ca.pem" = "core/clients/payment/certs/russian_trusted_root_ca.pem"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.basedpyright]
exclude = [
    "apps/guest_runtime/shim",
    "apps/guest_runtime/examples",
]

[dependency-groups]
core = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "a2a-sdk>=1.3.0,<2",
    "pydantic-settings>=2.16.2",
    "granian>=2.8.6",
    "asyncpg>=0.32.0",
    "redis>=8.1.0",
    "httpx2[http2]>=2.16.0",
    "aioboto3>=15.5.0",
    "boto3>=1.40.61",
    "bcrypt>=5.0.0",
    # tokie (зависимость chonkie 1.6+) публикует колёса cp314, но не cp314t.
    # check-ft-wheels ставит группу core на 3.14t только из колёс.
    "chonkie>=1.5.6,<1.6",
    "tree-sitter-language-pack>=1.22.1",
    "authlib>=1.9.1",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.26.0",
    "jinja2>=3.1.6",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "python-multipart>=0.0.32",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "pywebpush>=2.5.0",
    "opentelemetry-instrumentation-asyncpg>=0.66b1",
    "pgvector>=0.5.1",
    "croniter>=6.2.4",
    "markdown>=3.11.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "docxtpl>=0.20.2",
    "reportlab>=5.1.0",
    "unstructured[xlsx]>=0.21.5",
    "python-pptx>=1.0.2",
    "striprtf>=0.0.35",
    "odfpy>=1.4.1",
    "ebooklib>=0.20",
    "beautifulsoup4>=4.15.0",
    "extract-msg>=0.57.1",
    "yt-dlp>=2026.10.26",
    "structlog>=26.1.0",
    "trafilatura>=2.3.1",
    "aiosmtplib>=5.1.3",
    "aioimaplib>=2.0.3",
    "openfga-sdk>=0.10.5",
]

agents = [
    # <2.0: у 2.0 нет cp314t-wheels, под free-threaded Python собирается
    # только из sdist и падает на py_limited_api+Py_GIL_DISABLED.
    "pymupdf>=1.28.2,<2.0",
    "simpleeval>=1.0.8",
    "openai>=3.40.0",
    "Pillow>=13.0.0",
    "sse-starlette>=3.6.0",
    "pydub>=0.25.1",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
]

worker-base = [
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "openai>=3.40.0",
]

rag-worker = [
    "tiktoken>=0.14.0",
    "beautifulsoup4>=4.15.0",
]

crm = [
    "tiktoken>=0.14.0",
]

rag = [
    "flagembedding>=1.4.2",
    "litserve>=0.2.19",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
    "transformers>=5.21.0",
    "silero>=0.5.5",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "hydra-core>=1.3.8",
    "omegaconf>=2.3.1",
    "pyannote-audio>=4.0.7",
]

llm-model = [
    "torch>=2.15.0",
    "transformers>=5.21.0",
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
]

sync = [
    "livekit-api>=1.2.2",
    "websockets>=17.3",
]

browser = [
    "playwright>=1.64.1",
]

docs = [
    "zensical>=0.0.73",
]

dev = [
    "skia-python>=144.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-rerunfailures>=16.7",
    "filelock>=3.32.7",
    "ruff>=0.17.3",
    "websockets>=17.3",
    "schemathesis>=4.32.7",
    "coverage>=7.17.0",
    "pytest-timeout>=2.4.0",
    "playwright>=1.64.1",
    "xlwt>=1.3.0",
    "basedpyright>=1.40.2",
    "sqlalchemy>=2.1.6",
]

[tool.coverage.run]
source = ["apps", "core"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
ignore_errors = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
show_missing = true
precision = 2
skip_covered = false
skip_empty = true
