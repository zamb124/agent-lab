tests:
  - name: company-membership
    check:
      - user: user:anne
        object: company:acme
        assertions:
          owner: true
          member: true
          can_admin: true
      - user: user:bob
        object: company:acme
        assertions:
          member: true
          can_admin: false
          can_view: true

  - name: crm-entity-namespace-and-public
    check:
      - user: user:bob
        object: crm_entity:e1
        assertions:
          can_view: true
      - user: user:stranger
        object: crm_entity:public1
        assertions:
          can_view: true
      - user: user:stranger
        object: crm_entity:e1
        assertions:
          can_view: false

  - name: wiki-company-view-not-edit-and-parent-ttu
    check:
      - user: user:bob
        object: wiki_page:root
        assertions:
          can_view: true
          can_edit: false
      - user: user:carol
        object: wiki_page:child
        assertions:
          can_view: true
          can_edit: false
      - user: user:bob
        object: wiki_page:child
        assertions:
          can_view: false

  - name: office-company-view-only
    check:
      - user: user:bob
        object: document_catalog:docs
        assertions:
          can_view: true
          can_edit: false
      - user: user:dave
        object: document_catalog:docs
        assertions:
          can_view: true
          can_edit: true

  - name: sync-work-mail-membership
    check:
      - user: user:bob
        object: sync_channel:ch1
        assertions:
          can_view: true
          can_admin: false
      - user: user:bob
        object: work_queue:q1
        assertions:
          can_view: true
          can_admin: false
      - user: user:bob
        object: mailbox_binding:mb1
        assertions:
          can_view: true
          can_edit: false
      - user: user:anne
        object: mailbox_binding:mb1
        assertions:
          can_admin: true

    list_objects:
      - user: user:bob
        type: sync_channel
        assertions:
          can_view:
            - sync_channel:ch1
      - user: user:bob
        type: work_queue
        assertions:
          can_view:
            - work_queue:q1

  - name: flow-group-and-company-visible
    check:
      - user: user:eve
        object: flow:acme/flow1
        assertions:
          can_view: true
          can_edit: false
      - user: user:bob
        object: flow:acme/flow-public
        assertions:
          can_view: true
          can_edit: false
      - user: user:stranger
        object: flow:acme/flow1
        assertions:
          can_view: false
      - user: user:eve
        object: flow_branch:acme/flow1/main
        assertions:
          can_view: true
      - user: user:eve
        object: tool:acme/tool1
        assertions:
          can_view: true
      - user: user:ivan
        object: flow:acme/flow1
        assertions:
          can_view: true
          can_edit: true
          can_admin: true
      - user: user:ivan
        object: flow_branch:acme/flow1/main
        assertions:
          can_view: true
          can_edit: true

  - name: platform-admin-views-restricted-flow
    check:
      - user: user:root
        object: flow:acme/flow1
        assertions:
          can_view: true
          can_edit: true
          can_admin: false
      - user: user:root
        object: flow_branch:acme/flow1/main
        assertions:
          can_view: true
      - user: user:root
        object: tool:acme/tool1
        assertions:
          can_view: true
      - user: user:bob
        object: flow:acme/flow1
        assertions:
          can_view: false

  - name: cross-company-group-isolation
    check:
      - user: user:eve
        object: flow:acme/flow1
        assertions:
          can_view: true
      - user: user:eve-beta
        object: flow:acme/flow1
        assertions:
          can_view: false
      - user: user:eve-beta
        object: tool:acme/tool1
        assertions:
          can_view: false

  - name: flow-ui-share-public-viewer
    check:
      - user: user:stranger
        object: flow_ui_share:share1
        assertions:
          can_view: true
          can_edit: false
      - user: user:anne
        object: flow_ui_share:share1
        assertions:
          can_view: true
          can_edit: true

  - name: datasource-owner-and-company-visible
    check:
      - user: user:anne
        object: datasource:acme/ds1
        assertions:
          can_view: true
          can_edit: true
          can_admin: true
      - user: user:bob
        object: datasource:acme/ds1
        assertions:
          can_view: false
          can_edit: false
      - user: user:bob
        object: datasource:acme/ds-public
        assertions:
          can_view: true
          can_edit: false
      - user: user:stranger
        object: datasource:acme/ds1
        assertions:
          can_view: false
      - user: user:root
        object: datasource:acme/ds1
        assertions:
          can_view: true
          can_edit: true

  - name: stock-warehouse-viewer-editor
    check:
      - user: user:bob
        object: stock_warehouse:acme/wh1
        assertions:
          can_view: true
          can_edit: true
      - user: user:stranger
        object: stock_warehouse:acme/wh1
        assertions:
          can_view: false
          can_edit: false
      - user: user:bob
        object: stock_warehouse:acme/wh-restricted
        assertions:
          can_view: false
          can_edit: false
      - user: user:anne
        object: stock_warehouse:acme/wh-restricted
        assertions:
          can_view: true
          can_edit: true
          can_admin: true

  - name: platform-namespace-company-and-personal
    check:
      - user: user:bob
        object: platform_namespace:acme/default
        assertions:
          can_view: true
          can_edit: true
      - user: user:bob
        object: platform_namespace:acme/user-anne
        assertions:
          can_view: true
      - user: user:stranger
        object: platform_namespace:acme/user-anne
        assertions:
          can_view: false
      - user: user:anne
        object: platform_namespace:acme/user-anne
        assertions:
          can_view: true
          can_admin: true
