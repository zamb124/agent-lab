[pytest]
testpaths = tests/zed_search
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# НЕ наследуем БД-фикстуры из tests/conftest.py.
# zed-search тесты требуют только Ollama + Milvus + npx.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
timeout = 300
timeout_method = signal
timeout_func_only = true
addopts = -v --tb=short --asyncio-mode=auto
markers =
    integration: Integration tests (require Ollama + Milvus)
