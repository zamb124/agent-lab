[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Лимит на тело теста (pytest-timeout) — детектор зависания, не регрессии скорости.
# thread → dump stacks + os._exit(1): убивает зависший xdist-воркер (asyncio
# не прерывается SIGALRM). signal оставляет gw живым и стопорит всю сессию.
# База 60s: под coverage + контенцией БД на -n7/-n10 легальные немаркированные
# тесты спорадически >5s, и каждый такой timeout = мёртвый воркер + рестарт xdist;
# >max-worker-restart → INTERNALERROR и усечение сьюта. 60s совпадает с модой
# марок в conftest и floor hang_guard — kill-окно 75s в любой фазе.
# func_only=true: timeout только на call; setup/teardown — hang_guard.
# faulthandler_timeout=60: печатает стеки воркера при фазе дольше 60s — диагностика
# setup-повисаний до SIGKILL hang_guard'ом на ~75s; kill делает hang_guard/timeout.
faulthandler_timeout = 60
timeout = 60
timeout_method = thread
timeout_func_only = true
addopts = -v --tb=short --asyncio-mode=auto
filterwarnings =
    ignore:.*HTTP_413_REQUEST_ENTITY_TOO_LARGE.*:DeprecationWarning
    ignore:.*SwigPy.*has no __module__ attribute:DeprecationWarning
    ignore:.*swigvar.*has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning:
    ignore::DeprecationWarning:starlette\.templating
    ignore::DeprecationWarning:httpx\._models
    ignore::DeprecationWarning:httpx\._client
    ignore::DeprecationWarning:httpx2\._models
    ignore::DeprecationWarning:httpx2\._client
    ignore::DeprecationWarning:websockets\.legacy
    ignore:The HMAC key is .* bytes long.*:jwt.warnings.InsecureKeyLengthWarning
    ignore:The LitServer has both batch and unbatch methods implemented.*:UserWarning:litserve\.api
    ignore:Failed to load.*model2vec.*:UserWarning:chonkie\.embeddings\.auto
    ignore:The `get_sentence_embedding_dimension` method has been renamed.*:FutureWarning
    ignore:Could not load tokenizer with 'tokenizers'.*:UserWarning:chonkie\.tokenizer
    ignore:`torch.distributed.reduce_op` is deprecated.*:FutureWarning
markers =
    arch: архитектурные тесты
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require DB, Redis)
    e2e: End-to-end tests (require full stack)
    slow: Slow tests (can be skipped in CI)
    real_taskiq: тесты с реальным TaskIQ worker
    requires_code_runner: тесты, требующие code_runner_python (skip без стека)
    no_service_client_patch: тесты, где запрещен autouse monkeypatch ServiceClient -> ASGITransport
    no_test_doubles: тесты production-path без mock/patch/monkeypatch, включая autouse fixtures
    timeout: тесты с таймаутом выполнения
    scenario: UI E2E -> docs/scenarios/<service>/<tag>/<slug> (service=; tag= опционально, default general); step: details + screenshot_name; PNG рядом с README; EN: title_en+description_en, label_en+details_en
    ui_component: UI Kit Playwright L2 -> docs/scenarios/platform/ui-kit/<doc_slug> (service=platform, tag=ui-kit, component=, variant=, doc_slug=)
    no_crm_http: тесты без crm_client и HTTP CRM (моки в tests/crm)
    network: реальные HTTP-запросы в интернет (FileWriter, crawl, Tranco, live LLM)
