name: agentlab-dev

services:
  postgres:
    platform: "linux/amd64"
    image: pgvector/pgvector:0.8.7-pg18
    container_name: agentlab_postgres_dev
    environment:
      POSTGRES_DB: platform_shared
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: admin
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "54321:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql
      - ./migrations/postgres/init.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    command: postgres -c max_connections=300
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  redis:
    platform: "linux/amd64"
    image: redis:8.8.4-alpine
    container_name: agentlab_redis_dev
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "63791:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # SeaweedFS в Docker VM; uvicorn с хоста подписывает SigV4 по часам macOS — при дрейфе VM см. make dev-seaweedfs-restart
  # -volume.max=0: лимит вольюмов авто = свободное место / размер вольюма — иначе фиксированный лимит исчерпывается, т.к. каждый бакет (collection) резервирует свои вольюмы
  seaweedfs:
    platform: "linux/amd64"
    image: chrislusf/seaweedfs:4.51
    container_name: agentlab_seaweedfs_dev
    ports:
      - "19001:8333"
      - "19011:8888"
    volumes:
      - seaweedfs_dev_data:/data
      - ./deploy/seaweedfs/s3-dev.json:/etc/seaweedfs/s3.json:ro
    command: server -dir=/data -ip.bind=0.0.0.0 -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0 -master.volumeSizeLimitMB=2048
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev-net

  # init.sql не переигрывается на существующем postgres_dev_data — БД openfga
  # могла появиться в каноне после первого init тома. Helm: openfga_bootstrap_cluster.sh.
  openfga-db:
    platform: "linux/amd64"
    image: pgvector/pgvector:0.8.7-pg18
    container_name: agentlab_openfga_db_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: platform_user
      PGPASSWORD: admin
      PGHOST: postgres
      PGDATABASE: postgres
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        if ! psql -tc "SELECT 1 FROM pg_database WHERE datname = 'openfga'" | grep -q 1; then
          psql -c "CREATE DATABASE openfga"
        fi
        psql -c "GRANT ALL PRIVILEGES ON DATABASE openfga TO platform_user"
    networks:
      - dev-net
    restart: "no"

  openfga-migrate:
    platform: "linux/amd64"
    image: openfga/openfga:v1.22.1
    container_name: agentlab_openfga_migrate_dev
    depends_on:
      postgres:
        condition: service_healthy
      openfga-db:
        condition: service_completed_successfully
    command:
      - migrate
      - --datastore-engine
      - postgres
      - --datastore-uri
      - postgres://platform_user:admin@postgres:5432/openfga?sslmode=disable
    networks:
      - dev-net
    restart: "no"

  openfga:
    platform: "linux/amd64"
    image: openfga/openfga:v1.22.1
    container_name: agentlab_openfga_dev
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    command:
      - run
      - --datastore-engine
      - postgres
      - --datastore-uri
      - postgres://platform_user:admin@postgres:5432/openfga?sslmode=disable
      - --http-addr
      - 0.0.0.0:8080
      - --grpc-addr
      - 0.0.0.0:8081
      - --request-timeout
      - 30s
      - --max-concurrent-checks-per-batch-check
      - "10"
      - --max-concurrent-reads-for-check
      - "16"
      - --playground-enabled
      - --playground-port
      - "3000"
    ports:
      - "9090:8080"
      - "9091:8081"
      - "9092:3000"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=0.0.0.0:8081"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - dev-net

  # Chromium CDP для apps/browser (Playwright): хост http://127.0.0.1:9222 → BROWSER__CDP_URL.
  # Ручная проверка: в Chromium открыть chrome://inspect/#devices → Configure → localhost:9222.
  # Доп. флаги: снижают типичные сигналы автоматизации у процесса, поднятого до connect_over_cdp
  chromium-cdp:
    platform: "linux/amd64"
    image: zenika/alpine-chrome:124
    ports:
      - "9222:9222"
    shm_size: 1g
    command:
      - chromium-browser
      - --no-sandbox
      - --disable-dev-shm-usage
      - --disable-blink-features=AutomationControlled
      - --exclude-switches=enable-automation
      - --window-size=1920,1080
      - --lang=en-US
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9222/json/version >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - dev-net

  # External Cat Agent опционален - требует сборки образа, что замедляет запуск:
