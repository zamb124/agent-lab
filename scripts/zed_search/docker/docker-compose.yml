# zed-search: полный стек поиска в Docker Compose.
# Клиенты (Zed/Cursor) ходят только по HTTP + X-API-Key на 127.0.0.1.
# Репозиторий монтируется по тому же абсолютному пути, что и на хосте.

name: zed-search

x-repo-mount: &repo-mount
  type: bind
  source: ${REPO_ROOT}
  target: ${REPO_ROOT}
  read_only: true

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: zed-search-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd_data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: zed-search-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zedsearch}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zedsearch-change-me}
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    mem_limit: 512m
    # порты наружу НЕ публикуем

  milvus:
    image: milvusdb/milvus:${MILVUS_VERSION:-v2.6.7}
    container_name: zed-search-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-zedsearch}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-zedsearch-change-me}
      MQ_TYPE: woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    restart: unless-stopped
    mem_limit: 4g

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.9.6}
    container_name: zed-search-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 4g

  ollama-init:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.9.6}
    container_name: zed-search-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "[zed-search] pulling $$OLLAMA_MODEL..."
        ollama pull "$$OLLAMA_MODEL"
        echo "[zed-search] ollama model ready"
    restart: "no"
    mem_limit: 1g

  cbm:
    build:
      context: .
      dockerfile: Dockerfile.cbm
      args:
        # latest → при rebuild подтянется актуальный релиз/npm
        CBM_VERSION: ${CBM_VERSION:-latest}
        MCP_PROXY_VERSION: ${MCP_PROXY_VERSION:-latest}
    image: zed-search-cbm:local
    container_name: zed-search-cbm
    environment:
      REPO_ROOT: ${REPO_ROOT}
      MCP_API_KEY: ${MCP_API_KEY}
      CBM_CACHE_DIR: /cache
      CBM_ALLOWED_ROOT: ${REPO_ROOT}
      CBM_MEM_BUDGET_MB: ${CBM_MEM_BUDGET_MB:-8192}
      CBM_WORKERS: ${CBM_WORKERS:-4}
      CBM_SQLITE_MMAP_SIZE: "0"
      CBM_LOG_LEVEL: info
      CBM_AUTO_INDEX: "true"
      CBM_AUTO_WATCH: "false"
    volumes:
      - *repo-mount
      - cbm_cache:/cache
    ports:
      - "127.0.0.1:9751:9751"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:9751/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    mem_limit: 10g

  claude-context:
    build:
      context: .
      dockerfile: Dockerfile.claude-context
      args:
        CLAUDE_CONTEXT_MCP_VERSION: ${CLAUDE_CONTEXT_MCP_VERSION:-latest}
        MCP_PROXY_VERSION: ${MCP_PROXY_VERSION:-latest}
    image: zed-search-claude-context:local
    container_name: zed-search-claude-context
    environment:
      REPO_ROOT: ${REPO_ROOT}
      MCP_API_KEY: ${MCP_API_KEY}
      EMBEDDING_PROVIDER: Ollama
      EMBEDDING_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-2}
      OLLAMA_HOST: http://ollama:11434
      MILVUS_ADDRESS: milvus:19530
      CLAUDE_CONTEXT_BACKGROUND_SYNC: "false"
      CLAUDE_CONTEXT_TRIGGER_WATCHER: "true"
      HYBRID_MODE: ${HYBRID_MODE:-true}
      CUSTOM_IGNORE_PATTERNS: ".search-comparison/**,.cursor/debug-*.log,documentation-dist/**,artifacts/**,test-results/**,lightpanda/**,reports/**,*.map"
      HOME: /data
    volumes:
      - *repo-mount
      - claude_context_data:/data
    ports:
      - "127.0.0.1:9752:9752"
    depends_on:
      milvus:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:9752/ping',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 2g

  reindex-cron:
    image: python:3.12-alpine
    container_name: zed-search-reindex-cron
    depends_on:
      cbm:
        condition: service_healthy
      claude-context:
        condition: service_healthy
    environment:
      REPO_ROOT: ${REPO_ROOT}
      MCP_API_KEY: ${MCP_API_KEY}
      # 0 = не гонять периодический reindex (индексы живут в named volumes).
      REINDEX_INTERVAL_SEC: ${REINDEX_INTERVAL_SEC:-0}
      REINDEX_FORCE: ${REINDEX_FORCE:-false}
      CBM_URL: http://cbm:9751/mcp
      CLAUDE_URL: http://claude-context:9752/mcp
    volumes:
      - ./reindex-loop.sh:/reindex-loop.sh:ro
      - ../mcp_http.py:/mcp_http.py:ro
      - ${REPO_ROOT}:${REPO_ROOT}:ro
    entrypoint: ["/bin/sh", "/reindex-loop.sh"]
    restart: unless-stopped
    mem_limit: 256m

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  ollama_data:
  cbm_cache:
  claude_context_data:
