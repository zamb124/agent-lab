<!DOCTYPE html>
<html lang="%%LANG%%" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%%TITLE%%</title>
    <meta name="description" content="%%DESCRIPTION%%">
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
    <link rel="canonical" href="%%CANONICAL%%">
%%HREFLANG_BLOCK%%
    <link rel="alternate" type="application/rss+xml" title="%%PLATFORM_NAME%% Blog" href="%%BASE_URL%%/blog/feed.xml">
    <meta property="og:type" content="article">
    <meta property="og:locale" content="%%OG_LOCALE%%">
    <meta property="og:site_name" content="%%PLATFORM_NAME%%">
    <meta property="og:title" content="%%TITLE%%">
    <meta property="og:description" content="%%DESCRIPTION%%">
    <meta property="og:url" content="%%CANONICAL%%">
    <meta property="og:image" content="%%OG_IMAGE%%">
    <meta property="article:published_time" content="%%DATE%%">
    <meta property="article:modified_time" content="%%UPDATED%%">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="%%TITLE%%">
    <meta name="twitter:description" content="%%DESCRIPTION%%">
    <meta name="twitter:image" content="%%OG_IMAGE%%">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/core/assets/service_logos/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/core/assets/service_logos/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/static/core/assets/service_logos/favicon-48x48.png">
    <link rel="stylesheet" href="/static/core/assets/css/tokens.css">
    <link rel="stylesheet" href="/static/core/assets/css/reset.css">
    <script type="application/ld+json">%%LD_JSON%%</script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #0f3460 50%, #1a1a2e 75%, #16213e 100%);
            color: #e6e9f0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.7;
            min-height: 100vh;
        }
        .wrap { max-width: 760px; margin: 0 auto; padding: 24px 20px 64px; }
        .top { display: flex; align-items: center; gap: 14px; padding: 18px 0 40px; }
        .top img { width: 34px; height: 34px; }
        .top .brand { font-weight: 700; font-size: 18px; letter-spacing: .02em; }
        .top nav { margin-left: auto; display: flex; gap: 18px; }
        .top nav a { color: #9fb3d9; text-decoration: none; font-size: 14px; }
        .top nav a:hover { color: #fff; }
        .crumbs { font-size: 13px; color: #7d8db0; margin-bottom: 18px; }
        .crumbs a { color: #9fb3d9; text-decoration: none; }
        h1 { font-size: 34px; line-height: 1.25; margin: 0 0 14px; }
        .meta { color: #7d8db0; font-size: 14px; margin-bottom: 30px; }
        .lead { font-size: 18px; color: #c4cee8; margin-bottom: 28px; }
        article h2 { font-size: 23px; margin: 34px 0 12px; color: #f2f5fc; }
        article p { margin: 0 0 16px; }
        article ul, article ol { margin: 0 0 16px; padding-left: 24px; }
        article li { margin-bottom: 8px; }
        article a { color: #7ea8ff; }
        article code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 5px; font-size: .92em; }
        article pre { background: rgba(0,0,0,.35); padding: 16px; border-radius: 10px; overflow-x: auto; }
        article pre code { background: none; padding: 0; }
        .cta { margin-top: 48px; padding: 28px; border-radius: 16px; background: rgba(126,168,255,.10); border: 1px solid rgba(126,168,255,.25); }
        .cta h2 { margin: 0 0 10px; font-size: 21px; }
        .cta p { margin: 0 0 18px; color: #c4cee8; }
        .cta a.btn { display: inline-block; background: #3b6fe0; color: #fff; text-decoration: none; padding: 11px 22px; border-radius: 10px; font-weight: 600; }
        .foot { margin-top: 56px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.08); color: #7d8db0; font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
        .foot a { color: #9fb3d9; text-decoration: none; }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="top">
            <img src="/static/core/assets/service_logos/frontend_logo.svg" alt="%%PLATFORM_NAME%%">
            <span class="brand">%%PLATFORM_NAME%%</span>
            <nav>
                <a href="%%HOME_URL%%">%%NAV_HOME%%</a>
                <a href="%%BASE_URL%%/documentation/%%DOC_PREFIX%%">%%NAV_DOCS%%</a>
                <a href="%%PRODUCTS_URL%%">%%NAV_PRODUCTS%%</a>
            </nav>
        </header>
        <nav class="crumbs" aria-label="breadcrumbs">
            <a href="%%HOME_URL%%">%%NAV_HOME%%</a> / <a href="%%BLOG_URL%%">%%NAV_BLOG%%</a> / <span>%%TITLE%%</span>
        </nav>
        <main>
            <article>
                <h1>%%TITLE%%</h1>
                <div class="meta">%%DATE_HUMAN%% · %%AUTHOR%%</div>
                <p class="lead">%%SUMMARY%%</p>
                %%BODY%%
            </article>
            <section class="cta">
                <h2>%%CTA_TITLE%%</h2>
                <p>%%CTA_TEXT%%</p>
                <a class="btn" href="%%HOME_URL%%">%%CTA_BUTTON%%</a>
            </section>
        </main>
        <footer class="foot">
            <span>© %%YEAR%% %%PLATFORM_NAME%%</span>
            <a href="%%BLOG_URL%%">%%NAV_BLOG%%</a>
            <a href="%%BASE_URL%%/policy">%%FOOTER_POLICY%%</a>
        </footer>
    </div>
</body>
</html>
